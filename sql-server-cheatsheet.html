/*@@FILE kit/style.css@@*/
:root{
  color-scheme: light;
  --bg:#ffffff; --surface:#faf8f4; --surface-2:#f3efe7;
  --ink:#1d1a16; --ink-2:#4f4940; --ink-3:#81796d;
  --line:#ebe5da; --line-2:#d8d0c1;
  --accent:#95600a; --accent-fill:#e3a234; --accent-soft:#fbf1dc; --on-accent:#1d1a16;
  --rose:#bb1a4f; --rose-soft:#fdebf0;
  --teal:#0a766b; --teal-soft:#e2f3f0;
  --violet:#6a3ed2; --violet-soft:#efe9fd;
  --amber:#a86400; --amber-soft:#fdf1dc;
  --sky:#1d6aab; --sky-soft:#e6f0fa;
  --code-bg:#f8f5ef;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 6px 22px rgba(40,30,10,.07);
  --band-bg:#1d1a16; --band-edge:#1d1a16; --band-ink:#ffffff; --band-ink-2:#ddd6c9; --band-ink-3:#a89f90; --band-line:#6b655b; --band-hover:#35302a;
  --tk-kw:#7a3fc8; --tk-str:#0a766b; --tk-com:#8b8376; --tk-num:#b3580b; --tk-type:#1d6aab; --tk-fn:#8f5c06; --tk-at:#bb1a4f;
  --f-serif:'Fraunces',Georgia,'Times New Roman',serif;
  --f-sans:'Spline Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Spline Sans Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#15120e; --surface:#1c1813; --surface-2:#262019;
    --ink:#f2ede5; --ink-2:#c9c1b4; --ink-3:#9a9184;
    --line:#2d271f; --line-2:#3f372c;
    --accent:#ebb65c; --accent-fill:#e3a234; --accent-soft:#34270f; --on-accent:#15120e;
    --rose:#ff7d9c; --rose-soft:#3b1723;
    --teal:#52d3c0; --teal-soft:#0f302b;
    --violet:#b9a0ff; --violet-soft:#2a2044;
    --amber:#f4ab3e; --amber-soft:#36270d;
    --sky:#72b6f3; --sky-soft:#12283e;
    --code-bg:#1a1611;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.3);
    --band-bg:#2a231a; --band-edge:#4a4133; --band-ink:#f2ede5; --band-ink-2:#cfc7ba; --band-ink-3:#a39a8c; --band-line:#5d5343; --band-hover:#3b3125;
    --tk-kw:#c6a6ff; --tk-str:#72dccb; --tk-com:#8e8578; --tk-num:#f6a660; --tk-type:#82c1f6; --tk-fn:#ebb65c; --tk-at:#ff92ad; } }
:root[data-theme="dark"]{ color-scheme:dark;
    --bg:#15120e; --surface:#1c1813; --surface-2:#262019;
    --ink:#f2ede5; --ink-2:#c9c1b4; --ink-3:#9a9184;
    --line:#2d271f; --line-2:#3f372c;
    --accent:#ebb65c; --accent-fill:#e3a234; --accent-soft:#34270f; --on-accent:#15120e;
    --rose:#ff7d9c; --rose-soft:#3b1723;
    --teal:#52d3c0; --teal-soft:#0f302b;
    --violet:#b9a0ff; --violet-soft:#2a2044;
    --amber:#f4ab3e; --amber-soft:#36270d;
    --sky:#72b6f3; --sky-soft:#12283e;
    --code-bg:#1a1611;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.3);
    --band-bg:#2a231a; --band-edge:#4a4133; --band-ink:#f2ede5; --band-ink-2:#cfc7ba; --band-ink-3:#a39a8c; --band-line:#5d5343; --band-hover:#3b3125;
    --tk-kw:#c6a6ff; --tk-str:#72dccb; --tk-com:#8e8578; --tk-num:#f6a660; --tk-type:#82c1f6; --tk-fn:#ebb65c; --tk-at:#ff92ad; }

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-sans);font-feature-settings:"ss01"}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:5px}
code,kbd,pre{font-family:var(--f-mono)}
svg{flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,3vw,44px);padding-inline:clamp(16px,2.4vw,36px);max-width:1400px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;padding-block:22px 48px;padding-right:14px;border-right:1px solid var(--line);scrollbar-width:thin}
.side-brand{font:600 1.12rem/1.15 var(--f-serif);letter-spacing:-.01em;margin:0 0 4px 6px}
.side-meta{margin:0 0 12px 6px;font:500 11px/1.4 var(--f-mono);color:var(--ink-3)}
.nav-g{margin-top:12px}
.nav-gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px;cursor:pointer;text-align:left;border-radius:6px;font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav-gh:hover{background:var(--surface-2);color:var(--ink)}
.nav-g.cur .nav-gh{color:var(--ink)}
.nav-gh.on{background:var(--accent-soft);color:var(--ink)}
.nav-gh .chev{margin-left:auto;transition:transform .15s}
.nav-g.shut .chev{transform:rotate(-90deg)}
.nav-list{list-style:none;margin:2px 0 0 6px;padding:0 0 0 6px;border-left:1px solid var(--line)}
.nav-g.shut .nav-list{display:none}
.nav-i{display:flex;gap:6px;width:100%;background:none;border:0;padding:4px 8px;font-size:13.5px;color:var(--ink-2);text-align:left;cursor:pointer;border-radius:5px;line-height:1.35;align-items:baseline}
.nav-i .c{font:600 10.5px/1.7 var(--f-mono);color:var(--accent);flex:none;width:40px;letter-spacing:.04em}
.nav-i .n{flex:1;min-width:0}
.nav-i .ct{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent-fill)}
.nav-i.nav-top{font-weight:600;color:var(--ink)}
.main{min-width:0;padding-block:0 96px}
.scrim{position:fixed;inset:0;background:rgba(20,15,8,.42);z-index:40}

/* ---------- toolbar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 93%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.tbtn.menu-btn{display:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--ink)}
.tbtn.icon{padding:6px 8px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:9px;padding:0 8px 0 10px;background:var(--bg);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent-fill);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:8px 0;font:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search kbd{font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.hits{font:500 12px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-btn .sun{display:none}
  :root:not([data-theme="light"]) .theme-btn .moon{display:block}
}

/* ---------- hero ---------- */
.hero{padding-block:34px 4px;max-width:820px}
.eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
.hero h1{font:600 clamp(2.3rem,5.2vw,3.6rem)/1.02 var(--f-serif);font-variation-settings:"opsz" 144;letter-spacing:-.025em;margin:.28em 0 .3em;text-wrap:balance}
.lede{font-size:1.06rem;line-height:1.6;color:var(--ink-2);max-width:64ch;margin:0}
.now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px;max-width:820px}
.now-i{border-left:3px solid var(--c);background:var(--surface);border-radius:0 9px 9px 0;padding:8px 12px 9px;font-size:13px;line-height:1.45;color:var(--ink-2);min-width:0}
.now-i b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-bottom:1px}
.now-g{--c:var(--teal)} .now-b{--c:var(--rose)} .now-a{--c:var(--violet)}
@media (min-width:761px){ .now[data-n="1"]{grid-template-columns:minmax(0,1fr);max-width:420px} .now[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px} }

.legend{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 18px 16px;scroll-margin-top:76px}
.legend h2{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 12px}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 28px;font-size:13.8px;line-height:1.5;color:var(--ink-2)}
.howto li{min-width:0}
.howto .k{display:block;font:600 10.5px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.vkey{display:flex;flex-wrap:wrap;gap:6px}

/* program map */
.pmap{background:var(--code-bg);overflow-x:auto;padding:8px 0;font-size:12.6px;line-height:1.62;min-width:0}
.pl{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:stretch;min-width:max-content}
.pl.to{cursor:pointer}
.pl.to:hover,.pl.to.hot{background:var(--accent-soft)}
.pl code{white-space:pre;padding:0 16px 0 4px;color:var(--ink);font-size:inherit}
.pg{display:flex;align-items:center;justify-content:flex-end;padding:0 8px 0 0;border:0;background:none;font:600 10px/1 var(--f-mono);letter-spacing:.05em;color:var(--accent);cursor:pointer;border-right:1px solid var(--line)}
.pg:empty{cursor:default}
.pl.to:hover .pg{color:var(--ink)}

/* ---------- section headers ---------- */
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec-h .code{font:600 12px var(--f-mono);letter-spacing:.1em;color:var(--accent)}
.sec-h h2{font:600 clamp(1.5rem,3vw,2.05rem)/1.12 var(--f-serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sec-h .ct{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-3)}
.sec-tg{align-self:center;flex:none;width:28px;height:28px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-3)}
.sec-tg:hover{color:var(--ink);border-color:var(--ink-3)}
.sec-tg svg{transition:transform .15s}
.sec.shut .sec-tg svg{transform:rotate(-90deg)}
.sec.shut .blks,.sec.shut .short,.sec.shut .jump{display:none}
.sec-blurb{color:var(--ink-2);max-width:72ch;margin:10px 0 0}

/* ---------- sections & blocks ---------- */
.sec{margin-top:60px;scroll-margin-top:70px}
.blks{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;scroll-margin-top:76px;overflow:hidden}
.blk.flash{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);border-color:var(--accent-fill)}
.blk-h{display:flex;align-items:center;gap:8px 10px;padding:10px 10px 9px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.blk-h .bt{font:600 15px/1.35 var(--f-sans);margin:0;flex:1 1 14rem;min-width:0;letter-spacing:-.003em}
.blk-h .bt code,.note code,.tbl code,.call code,.sec-blurb code,.lede code,.legend code,.wdg code,.short code,.sub code,.gcard code,.prog-cap code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.blk-h .tools{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.ver{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.ver.v-new{background:var(--teal-soft);color:var(--teal)}
.ver.v-next{background:var(--violet-soft);color:var(--violet)}
.lang{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px}
.cp{border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:4px 9px;font:600 11px var(--f-sans);letter-spacing:.02em;cursor:pointer;color:var(--ink-2)}
.cp:hover{color:var(--ink);border-color:var(--ink-3)}
.src{margin:0;padding:10px 0;overflow-x:auto;font-size:12.8px;line-height:1.6;tab-size:4;color:var(--ink);background:var(--code-bg)}
.src code{display:inline-block;min-width:100%;background:none;padding:0;font-size:inherit}
.ln{display:block;padding:0 16px;min-height:1.6em;white-space:pre}
.ln-b{background:color-mix(in srgb,var(--rose) 11%,transparent);box-shadow:inset 3px 0 0 var(--rose)}
.ln-g{background:color-mix(in srgb,var(--teal) 11%,transparent);box-shadow:inset 3px 0 0 var(--teal)}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic}
.tk-num{color:var(--tk-num)} .tk-type{color:var(--tk-type)} .tk-fn{color:var(--tk-fn)} .tk-at{color:var(--tk-at)}
body.wrap .ln{white-space:pre-wrap;overflow-wrap:anywhere}
body.wrap .src code{display:block}
.note{margin:0;padding:9px 16px 11px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--bg)}

/* good vs bad */
.gb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.gb-c{min-width:0;display:flex;flex-direction:column}
.gb-c + .gb-c{border-left:1px solid var(--line)}
.gb-h{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;border-bottom:1px solid var(--line)}
.verdict{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.gb-b .verdict{background:var(--rose-soft);color:var(--rose)}
.gb-g .verdict{background:var(--teal-soft);color:var(--teal)}
.gb-h .cp{margin-left:auto}
.gb-c .src{flex:1}
.gb-c .note{border-top:1px solid var(--line)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45}
.tbl th{text-align:left;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);min-width:7rem}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl.mono1 td:first-child{font:600 12.5px/1.5 var(--f-mono)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface)}
.tbl .y{color:var(--teal);font-weight:600} .tbl .n{color:var(--rose);font-weight:600}

/* callouts */
.call{margin:0;padding:10px 14px 11px;border-radius:10px;font-size:14px;color:var(--ink);border:0}
.call .kl{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.call-trap{background:var(--amber-soft)} .call-trap .kl{color:var(--amber)}
.call-tip{background:var(--teal-soft)} .call-tip .kl{color:var(--teal)}
.call-key{background:var(--violet-soft)} .call-key .kl{color:var(--violet)}

/* diagram frame */
.dgf{margin:0}
.dgf-top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.dgf figcaption{font-size:13.5px;color:var(--ink-2);flex:1 1 16rem;min-width:0;line-height:1.45}
.dgf figcaption b{font-weight:600;color:var(--ink)}
.dg-scroll{overflow-x:auto;padding:12px 10px 10px;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dg-scroll svg{display:block;width:100%;height:auto;margin:0 auto}
.dg-err{padding:12px;color:var(--rose);font:12px var(--f-mono)}
.blk[data-state="b"] .st-f,.blk[data-state="f"] .st-b{display:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;background:var(--bg);flex:none}
.seg button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer;line-height:1.5}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg button[data-s="b"][aria-pressed="true"]{background:var(--rose-soft);color:var(--rose)}
.seg button[data-s="f"][aria-pressed="true"]{background:var(--teal-soft);color:var(--teal)}

/* ---------- widgets ---------- */
.wdg{padding:14px 16px 16px;display:grid;gap:14px;min-width:0}
.wdg-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.wdg-lbl{font:500 13px/1.3 var(--f-sans);color:var(--ink-2);min-width:11.5rem}
.wdg-code{font:500 12.5px/1.6 var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre;color:var(--ink)}
.verdict-line{padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.verdict-line.ok{background:var(--teal-soft)} .verdict-line.warn{background:var(--amber-soft)} .verdict-line.bad{background:var(--rose-soft)}
.verdict-line b{font-weight:600}

/* picker widget */
.coll{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:14px;align-items:start}
.coll-needs{display:grid;gap:4px}
.coll-needs button{text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;color:var(--ink-2);line-height:1.35}
.coll-needs button:hover{background:var(--surface-2);color:var(--ink)}
.coll-needs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--ink);font-weight:600}
.coll-out{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}

/* steps widget */

.empty{margin-top:40px;padding:26px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;color:var(--ink-3)}

/* ---------- map: one card per group, with its sections and tasks ---------- */
.map{margin-top:40px;scroll-margin-top:70px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;margin-top:18px;align-items:start}
.gcard{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;overflow:hidden}
.gcard header{padding:13px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.gcard h3{margin:0;font:600 1.22rem/1.2 var(--f-serif);letter-spacing:-.005em}
.gcard h3 button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;text-align:left}
.gcard h3 button:hover{color:var(--accent)}
.gcard .gq{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.glabel,.gtasks summary{display:flex;align-items:center;gap:8px;margin:0;padding:10px 16px 2px;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.glabel .ct,.gtasks summary .ct{margin-left:auto;font-weight:500;letter-spacing:.02em;text-transform:none}
.glist{list-style:none;margin:0;padding:2px 6px 8px}
.grow{display:flex;gap:6px;align-items:baseline;width:100%;min-width:0;background:none;border:0;border-radius:6px;padding:4px 10px;font-size:13.5px;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer}
.grow .c{font:600 10.5px/1.7 var(--f-mono);color:var(--accent);flex:none;width:44px;letter-spacing:.04em}
.grow .n{flex:1;min-width:0}
.grow .ct{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.grow:hover{background:var(--accent-soft)}
.gtasks{border-top:1px solid var(--line)}
.gtasks summary{cursor:pointer;list-style:none;padding-bottom:4px}
.gtasks summary::-webkit-details-marker{display:none}
.gtasks summary::before{content:"";flex:none;width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.gtasks[open] summary::before{transform:rotate(45deg)}
.gtasks summary:hover{color:var(--ink)}
.gtasks:not([open]) summary{padding-bottom:11px}
.trow{display:flex;align-items:baseline;gap:4px;padding-right:6px}
.trow .grow{flex:1}
.also{flex:none;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:0 7px;font:600 10px/1.75 var(--f-mono);letter-spacing:.04em;color:var(--ink-3);cursor:pointer}
.also::before{content:"+ "}
.also:hover{border-color:var(--accent-fill);color:var(--ink);background:var(--accent-soft)}

/* ---------- group band: the divider that starts each group ---------- */
.gband{margin-top:76px;padding:18px 22px 20px;border-radius:14px;background:var(--band-bg);color:var(--band-ink);border:1px solid var(--band-edge);scroll-margin-top:70px}
.gband .gk{margin:0;font:600 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-fill)}
.gband h2{margin:.2em 0 .14em;font:600 clamp(1.7rem,3.6vw,2.4rem)/1.08 var(--f-serif);font-variation-settings:"opsz" 144;letter-spacing:-.018em;text-wrap:balance}
.gband .gq{margin:0;font-size:1.03rem;line-height:1.5;color:var(--band-ink-2)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--band-line);background:none;border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;line-height:1.5;color:var(--band-ink);cursor:pointer}
.gchip .c{font:600 10px var(--f-mono);letter-spacing:.04em;color:var(--band-ink-3)}
.gchip:hover{background:var(--band-hover)}
.gband + .sec{margin-top:34px}

/* ---------- section opening: takeaways and jump links ---------- */
.short{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 16px 12px}
.short-k,.jump-k{margin:0;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.short ul{list-style:none;margin:7px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px}
.short li{position:relative;padding-left:15px;font-size:13.8px;line-height:1.45;color:var(--ink);min-width:0}
.short li::before{content:"";position:absolute;left:0;top:.52em;width:7px;height:7px;border-radius:2px;background:var(--accent-fill)}
.jump{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.jump-k{margin-right:4px}
.jchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 10px 3px 11px;font-size:12.5px;line-height:1.5;color:var(--ink);cursor:pointer}
.jchip .n{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.jchip:hover{border-color:var(--accent-fill);background:var(--accent-soft)}

/* sub-heading inside a long section */
.sub{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin:20px 0 0;font:600 1.18rem/1.25 var(--f-serif);letter-spacing:-.005em;color:var(--ink);scroll-margin-top:76px;min-width:0}
.sub::after{content:"";order:1;flex:1;align-self:center;height:1px;background:var(--line-2);min-width:12px}
.sub .n{order:2;flex:none;font:500 11px var(--f-mono);letter-spacing:.02em;color:var(--ink-3)}
.blks > .sub:first-child{margin-top:6px}
.sub.flash > span:first-child{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);border-radius:3px}

/* a trap, tip or key point that belongs to one card is its last strip */
.blk > .call{border-radius:0;border-top:1px solid var(--line);padding:10px 16px 11px}

/* while searching, results stay tight */
body.searching .short,body.searching .jump{display:none}

/* legend chips and inline keys */
.lk{display:inline-block;font:600 10px/1.5 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;padding:1px 7px;border-radius:5px;margin-right:3px}
.lk-trap{background:var(--amber-soft);color:var(--amber)} .lk-tip{background:var(--teal-soft);color:var(--teal)} .lk-key{background:var(--violet-soft);color:var(--violet)}

@media (max-width:860px){
  .short ul{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (max-width:760px){
  .gband{margin-top:56px;padding:16px 16px 18px}
  .short{padding:10px 14px 12px}
  .blk > .call{padding:10px 14px 11px}
  .sub{font-size:1.1rem}
}
@media print{
  .gband{background:none;color:var(--ink);border:2px solid var(--ink)}
  .gband .gk,.gband .gq,.gchip,.gchip .c{color:var(--ink)}
  .jump{display:none}
}

/* ---------- the annotated file that can open a group ---------- */
.prog{margin-top:34px}
.prog-cap{margin:0;padding:9px 16px 10px;font-size:13.5px;line-height:1.5;color:var(--ink-2);border-bottom:1px solid var(--line);background:var(--surface)}
.prog-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,17.5rem)}
.prog-secs{list-style:none;margin:0;padding:8px 6px;border-left:1px solid var(--line);align-content:start}
.prog-secs .glabel{padding:4px 10px 4px}
.prog-secs .grow.hot{background:var(--accent-soft)}
@media (max-width:1120px){
  .prog-body{grid-template-columns:minmax(0,1fr)}
  .prog-secs{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr))}
  .prog-secs .glabel{grid-column:1/-1}
}

/* section header on a phone: title and toggle share one row */
@media (max-width:760px){
  .sec .sec-h{flex-wrap:nowrap}
  .sec .sec-h h2{flex:1;min-width:0}
  .sec .sec-h .ct{display:none}
}
/*@@FILE sheet/sheet.css@@*/
/* ===== Styles for the SQL Server sheet's own widgets (80-widgets.js). Tokens only: every colour comes from the kit. ===== */
.wdg > *{min-width:0}
.wdg .seg{flex-wrap:wrap;max-width:100%}
.verdict-line.info{background:var(--surface-2)}
.arrow{color:var(--ink-3);font-size:13px}

.tbl.dt td:first-child{font-weight:500}
.tbl tr.gone td{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rose);background:var(--rose-soft)}

.coll-out .src{border-bottom:1px solid var(--line)}
.coll-out .tbl-wrap{border-bottom:1px solid var(--line)}

/* query order stepper */
.ev-top{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem;gap:12px;align-items:start}
.ev-code{margin:0;font:500 12.5px/1.6 var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 0;overflow-x:auto;color:var(--ink)}
.ev-ln{display:block;padding:0 12px;white-space:pre;min-height:1.6em;min-width:max-content}
.ev-ln.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent-fill)}
.ev-ctl{display:flex;flex-direction:column;gap:6px}
.ev-ctl .tbtn{justify-content:center}
.ev-ctl .tbtn:disabled{opacity:.45;cursor:default}
.ev-ct{font:500 11px/1.4 var(--f-mono);color:var(--ink-3);text-align:center}
.qo-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.qo-chips button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 11px 3px 4px;font:600 12px/1.5 var(--f-mono);color:var(--ink-3);cursor:pointer}
.qo-chips button:hover{color:var(--ink)}
.qo-chips .ix{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--surface-2);font-size:10.5px;color:var(--ink-3)}

.qo-chips li.done .ix{background:var(--teal-soft);color:var(--teal)}
.qo-chips li.cur button{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--ink)}
.qo-chips li.cur .ix{background:var(--accent-fill);color:var(--on-accent)}
.qo-out{border:1px solid var(--line);border-radius:10px}

/* join visualizer */
.jn-src{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.jn-src h4{margin:0 0 4px;font:600 11.5px/1.4 var(--f-mono);color:var(--ink-2)}
.tbl.mini{font:500 12px/1.4 var(--f-mono);background:var(--bg);border:1px solid var(--line)}
.tbl.mini th{padding:4px 8px;font-size:9.5px;background:var(--bg)}
.tbl.mini td{padding:3px 8px;font-size:12px;color:var(--ink)}

.jn-tbl td{font-family:var(--f-mono);font-size:12.5px}

/* window explorer */

.wn-key .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.wn-key .sw.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-fill)}
.wn-key .sw.fr{background:var(--sky-soft);box-shadow:inset 0 0 0 1.5px var(--sky)}

/* isolation levels */
.iso-steps td:first-child{width:2rem;min-width:0}
.iso-steps td:nth-child(2){width:4.5rem;min-width:0;font:600 12.5px var(--f-mono)}
.iso-steps td:nth-child(3){min-width:14rem}
.coll-out .iso-code{border-top:0}
.coll-out .iso-code small,.ix-best .ty small{font:500 12px var(--f-sans);color:var(--ink-3)}

/* index simulator */
.opts{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 20rem}
.opts button{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:5px 10px;font:500 12.5px/1.4 var(--f-mono);color:var(--ink-2);cursor:pointer;text-align:left}
.opts button:hover{color:var(--ink);background:var(--surface)}
.opts button[aria-pressed="true"]{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--ink);font-weight:600}
.ix-q .src{border:1px solid var(--line);border-radius:8px}
.plan{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.op{display:inline-flex;align-items:center;border:1.5px solid var(--k);background:var(--kf);border-radius:8px;padding:4px 10px;font:600 12.5px/1.4 var(--f-mono);color:var(--ink)}
.op.k-g{--k:var(--teal);--kf:var(--teal-soft)} .op.k-b{--k:var(--rose);--kf:var(--rose-soft)}
.op.k-w{--k:var(--amber);--kf:var(--amber-soft)} .op.k-s{--k:var(--sky);--kf:var(--sky-soft)}
.pred{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:4px 12px;font-size:13.5px;color:var(--ink-2);align-items:baseline}
.pred b{font:600 10.5px/1.8 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ix-best{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ix-best .ty{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface)}

@media (max-width:760px){
  .ev-top{grid-template-columns:minmax(0,1fr)}
  .ev-ctl{flex-direction:row;flex-wrap:wrap;align-items:center}
  .tbl.dt{display:table;width:100%}
  .tbl.dt thead{display:table-header-group}
  .tbl.dt tbody{display:table-row-group}
  .tbl.dt tr{display:table-row;padding:0;border-bottom:0}
  .tbl.dt td{display:table-cell;padding:5px 8px;border-bottom:1px solid var(--line)}
  .tbl.dt tr:last-child td{border-bottom:0}
  .tbl.dt td:first-child{margin-bottom:0}
  .tbl.dt td::before{content:none!important}
  .jn-src{grid-template-columns:minmax(0,1fr)}
  .pred{grid-template-columns:minmax(0,1fr);gap:0}
  .iso-steps td:first-child,.iso-steps td:nth-child(2){width:auto}
  .iso-steps td:nth-child(3){min-width:0}
}
</style>

      </button>
    </div>

    <header class="hero" id="hero"></header>

    <section class="map" id="map" aria-labelledby="map-h">

window.NCS.push({
  id: 'tx', code: 'TX', name: 'Transactions and errors',
  blurb: 'A transaction makes several statements succeed or fail as one unit. `TRY…CATCH` catches an error so you can roll back, and `THROW` passes the error on to the caller.',
  short: [
    'Start every procedure that changes data with `SET XACT_ABORT ON`: any error or timeout then rolls the whole transaction back.',
    'In `CATCH`, roll back if a transaction is open, then `THROW` to re-raise the original error.',
    'Keep transactions short. Every lock is held until `COMMIT`.'

  blocks: [
    { k: 'snip', id: 'tx-template', t: 'The procedure template: `XACT_ABORT`, `TRY…CATCH`, `THROW`', code: `
CREATE OR ALTER PROCEDURE dbo.TransferFunds
    @From int, @To int, @Amount decimal(19, 4)
AS
BEGIN
    SET NOCOUNT, XACT_ABORT ON;              -- any error or timeout rolls the transaction back
    BEGIN TRY
        BEGIN TRANSACTION;
        UPDATE dbo.Accounts SET Balance -= @Amount WHERE Id = @From;
        IF @@ROWCOUNT = 0 THROW 50001, N'Source account not found.', 1;
        UPDATE dbo.Accounts SET Balance += @Amount WHERE Id = @To;
        IF @@ROWCOUNT = 0 THROW 50002, N'Target account not found.', 1;
        COMMIT;
    END TRY
    BEGIN CATCH
        IF @@TRANCOUNT > 0 ROLLBACK;
        THROW;                               -- re-raise the original error, number and all
    END CATCH
END;`,
      call: { kind: 'key', text: 'No user input, HTTP calls or message-bus sends inside `BEGIN TRANSACTION … COMMIT`. A transaction that waits on the outside world holds its locks for as long as it waits, and blocks everyone behind it.' } },

    WHERE Period = @period;   -- slow

SELECT r.session_id, r.blocking_session_id, r.wait_type, r.wait_time / 1000.0 AS wait_s,
       DB_NAME(r.database_id) AS db, t.text AS waiting_sql
FROM sys.dm_exec_requests AS r
CROSS APPLY sys.dm_exec_sql_text(r.sql_handle) AS t
WHERE r.blocking_session_id <> 0;

SELECT s.session_id, s.login_name, s.program_name, s.open_transaction_count,
       t.text AS last_sql                                    -- the head blocker is often idle
FROM sys.dm_exec_sessions AS s
JOIN sys.dm_exec_connections AS c ON c.session_id = s.session_id
CROSS APPLY sys.dm_exec_sql_text(c.most_recent_sql_handle) AS t
WHERE s.session_id IN (SELECT blocking_session_id FROM sys.dm_exec_requests)
  AND s.session_id NOT IN (SELECT session_id FROM sys.dm_exec_requests

DECLARE @try int = 1;
WHILE 1 = 1
BEGIN
    BEGIN TRY
        BEGIN TRANSACTION;
        EXEC dbo.PostJournal @JournalId = @id;
        COMMIT;
        BREAK;
    END TRY
    BEGIN CATCH
        IF @@TRANCOUNT > 0 ROLLBACK;
        IF ERROR_NUMBER() <> 1205 OR @try >= 3 THROW;   -- give up on other errors

SELECT @name = Name FROM dbo.Customers WHERE Id = @id;         -- ✗ no row found: @name keeps 'previous'

SET @name = (SELECT Name FROM dbo.Customers WHERE Id = @id);   -- ✓ no row: NULL; two rows: error 512

SELECT @total = SUM(Total), @n = COUNT(*) FROM dbo.Orders;     -- several variables in one statement` },

      bad: `
CREATE FUNCTION dbo.Balance (@CustomerId int)
RETURNS decimal(19, 4)
AS BEGIN
    RETURN (SELECT SUM(Amount) FROM dbo.Ledger
            WHERE CustomerId = @CustomerId);
END;
GO
SELECT Id, Name, dbo.Balance(Id) AS Balance
FROM dbo.Customers;       -- ✗ a query per row`,
      badNote: 'SQL Server cannot see inside the function, so it runs it once for every customer. SQL Server 2019+ merges some scalar functions into the query automatically, but not all.',
      good: `
CREATE FUNCTION dbo.BalanceT (@CustomerId int)
RETURNS TABLE
AS RETURN (SELECT SUM(Amount) AS Balance
           FROM dbo.Ledger
           WHERE CustomerId = @CustomerId);
GO
SELECT c.Id, c.Name, b.Balance
FROM dbo.Customers AS c
CROSS APPLY dbo.BalanceT(c.Id) AS b;  -- ✓ one plan`,

CREATE OR ALTER VIEW dbo.DailySales
WITH SCHEMABINDING                                    -- required before indexing
AS
SELECT o.OrderDate, COUNT_BIG(*) AS Orders,          -- COUNT_BIG(*) required with GROUP BY
       SUM(o.Total) AS Revenue                        -- Total must be NOT NULL
FROM dbo.Orders AS o
GROUP BY o.OrderDate;
GO
CREATE UNIQUE CLUSTERED INDEX UCX_DailySales ON dbo.DailySales (OrderDate);   -- now stored

SELECT OrderDate, Revenue
FROM dbo.DailySales WITH (NOEXPAND)                   -- Standard edition needs the hint to use it
WHERE OrderDate >= '20260901';`,
      note: 'SQL Server updates an indexed view on every write to `dbo.Orders`. That is great for totals that are read often, and a cost on tables that are written all day.' },

      bad: `
CREATE OR ALTER TRIGGER dbo.trg_Orders_Audit
ON dbo.Orders AFTER UPDATE
AS
BEGIN
    DECLARE @id int = (SELECT Id FROM inserted);
    INSERT dbo.OrderAudit (OrderId, ChangedAt)
    VALUES (@id, SYSUTCDATETIME());
END;   -- ✗ error 512 for a two-row UPDATE`,
      good: `
CREATE OR ALTER TRIGGER dbo.trg_Orders_Audit
ON dbo.Orders AFTER UPDATE
AS
BEGIN
    SET NOCOUNT ON;
    INSERT dbo.OrderAudit
           (OrderId, OldStatus, NewStatus, ChangedAt)
    SELECT i.Id, d.Status, i.Status, SYSUTCDATETIME()
    FROM inserted AS i
    JOIN deleted AS d ON d.Id = i.Id
    WHERE i.Status <> d.Status;  -- ✓ every row
END;`,

window.NCS.push({
  id: 'dyn', code: 'DYN', name: 'Dynamic SQL',
  blurb: 'Dynamic SQL is a query you build as a string and then run. You need it when a table name, a sort column or the set of filters is only known at run time. Built carelessly, it is how SQL injection happens.',
  short: [
    'Never glue user input into the SQL text. Pass values as parameters to `sp_executesql`.',
    'Names cannot be parameters. Choose them from a fixed list, then wrap them in `QUOTENAME`.',
    'Declare the string as `nvarchar(max)`, and start a long concatenation with an `nvarchar(max)` value.'
  ],
  blocks: [
    { k: 'gb', id: 'dyn-exec', t: '`sp_executesql` with parameters, never `EXEC(string)`',
      bad: `
DECLARE @sql nvarchar(max) =
    N'SELECT Id, Name FROM dbo.Customers ' +
    N'WHERE Name = ''' + @name + N'''';
EXEC (@sql);
-- ✗ @name = N'x'' OR 1=1 --' returns everyone`,
      badNote: 'SQL injection, plus a new compiled plan for every different name.',
      good: `
DECLARE @sql nvarchar(max) =
    N'SELECT Id, Name FROM dbo.Customers ' +
    N'WHERE Name = @name;';
EXEC sys.sp_executesql @sql,
     N'@name nvarchar(100)',   -- declarations
     @name = @name;            -- ✓ a value, not code`,
      goodNote: 'One reusable plan, and no value can change what the statement does.' },

    { k: 'snip', id: 'dyn-ident', t: 'Table and column names: choose from a fixed list, then `QUOTENAME`', code: `
DECLARE @col sysname = CASE @SortBy              -- the caller picks a sort key, not a column name
        WHEN 'date'   THEN N'CreatedAt'
        WHEN 'amount' THEN N'Total'
        ELSE N'Id' END;
DECLARE @dir nvarchar(4) = CASE WHEN @Desc = 1 THEN N'DESC' ELSE N'ASC' END;

DECLARE @sql nvarchar(max) =
    N'SELECT TOP (@n) Id, CreatedAt, Total FROM dbo.Orders ORDER BY '
    + QUOTENAME(@col) + N' ' + @dir + N';';
EXEC sys.sp_executesql @sql, N'@n int', @n = @PageSize;` },

    { k: 'snip', id: 'dyn-search', t: 'Optional filters: build only what is needed', code: `
CREATE OR ALTER PROCEDURE dbo.SearchOrders
    @CustomerId int = NULL, @Status varchar(10) = NULL, @From date = NULL
AS
BEGIN
    SET NOCOUNT ON;
    DECLARE @sql nvarchar(max) =
        N'SELECT Id, CustomerId, Status, CreatedAt FROM dbo.Orders WHERE 1 = 1';
    IF @CustomerId IS NOT NULL SET @sql += N' AND CustomerId = @CustomerId';
    IF @Status IS NOT NULL     SET @sql += N' AND Status = @Status';
    IF @From IS NOT NULL       SET @sql += N' AND CreatedAt >= @From';
    EXEC sys.sp_executesql @sql,
         N'@CustomerId int, @Status varchar(10), @From date',
         @CustomerId, @Status, @From;     -- one cached plan per combination actually used
END;`,
      note: 'The alternative is one fixed query with `(@p IS NULL OR col = @p)` plus `OPTION (RECOMPILE)`, or the automatic optional-parameter plans in SQL Server 2025 (see SNIFF).',
      call: { kind: 'trap', text: 'Dynamic SQL runs in its own scope: a `#temp` table it creates is gone when it ends. It also runs with the caller’s own permissions, so the caller needs rights on the tables it touches (see SEC). And `sp_executesql` only accepts `nvarchar` text: a `varchar` `@sql` fails with error 214.' } },

    { k: 'gb', id: 'dyn-trunc', t: 'The silent cut at 4,000 characters',

SET @sql = REPLICATE(N'x', 3000)

SELECT LEN(@sql);            -- ✗ 4000`,

window.NCS.push({
  id: 'sarg', code: 'SARG', name: 'Filters that can use an index',
  blurb: 'A filter is SARGable (“search-argument-able”) when SQL Server can use an index to seek straight to the matching rows. Wrap the column in a function, or compare it with a different type, and SQL Server has to scan every row instead.',
  short: [
    'Leave the column bare. Do the math or the function on the parameter side.',
    'Filter a date range with `>=` the start and `<` the day after the end, never `BETWEEN`.',
    'Send parameters in the column’s type. An `nvarchar` value against a `varchar` column converts every row.'
  ],
  blocks: [
    { k: 'table', id: 'sarg-rules', t: 'Rewrites that turn a scan into a seek',
      cols: ['Instead of', 'Write', 'Why'],
      rows: [
        ['`YEAR(CreatedAt) = 2026`', '`CreatedAt >= \'20260101\' AND CreatedAt < \'20270101\'`', 'a function hides the column from the index'],
        ['`DATEADD(day, 30, DueOn) < @today`', '`DueOn < DATEADD(day, -30, @today)`', 'move the math to the parameter side'],
        ['`ISNULL(Status, \'Open\') = \'Open\'`', '`(Status = \'Open\' OR Status IS NULL)`', '`ISNULL` wraps the column'],
        ['`LEFT(Ref, 3) = \'INV\'`', '`Ref LIKE \'INV%\'`', 'a `LIKE` on a prefix is a range the index can seek'],
        ['`Total * 1.1 > 1000`', '`Total > 1000 / 1.1`', 'arithmetic on the column'],
        ['`CAST(CreatedAt AS date) = @d`', 'leave it', 'the one exception: SQL Server turns it into a range and still seeks'],
        ['`Iban = N\'NL91…\'` on a `varchar` column', '`Iban = \'NL91…\'`', 'an `nvarchar` value converts the column'],
        ['`Ref LIKE \'%123\'`', 'a stored `REVERSE(Ref)` column with an index', 'a wildcard at the start cannot seek']
      ],
      call: { kind: 'tip', text: 'Can’t change the query? Index the expression instead: `ALTER TABLE dbo.Orders ADD CreatedYear AS YEAR(CreatedAt)` plus an index on `CreatedYear`. SQL Server matches `YEAR(CreatedAt) = 2026` in existing queries to the indexed computed column.' } },

    { k: 'gb', id: 'sarg-date', t: 'Date ranges: `>=` and `<`, never `BETWEEN`',
      bad: `
WHERE CreatedAt BETWEEN '2026-09-01'
                    AND '2026-09-30'
-- ✗ misses Sept 30 after midnight

WHERE MONTH(CreatedAt) = 9
  AND YEAR(CreatedAt) = 2026
-- ✗ reads every row`,
      good: `
WHERE CreatedAt >= '20260901'
  AND CreatedAt <  '20261001'
-- ✓ >= and <: right at any precision,
--   and it can seek`,
      goodNote: '`yyyymmdd` literals read the same under every language setting. `yyyy-mm-dd` can be misread as year-day-month by the old `datetime` type.' },

    { k: 'gb', id: 'sarg-impl', t: 'Hidden conversion: an `nvarchar` parameter on a `varchar` column',
      bad: `
-- dbo.Accounts.Iban is varchar(34);
-- .NET sends strings as nvarchar by default
DECLARE @iban nvarchar(34) = N'NL91ABNA0417164300';
SELECT Id FROM dbo.Accounts
WHERE Iban = @iban;  -- ✗ CONVERT_IMPLICIT: scan`,
      badNote: 'When the two types differ, SQL Server converts the `varchar` side to `nvarchar`. Here that side is the column, so every row is converted.',
      good: `
DECLARE @iban varchar(34) = 'NL91ABNA0417164300';
SELECT Id FROM dbo.Accounts
WHERE Iban = @iban;  -- ✓ seek
-- Dapper:   new DbString { Value = iban,
--                          IsAnsi = true, Length = 34 }
-- SqlClient: new SqlParameter("@iban",
--                          SqlDbType.VarChar, 34)`,
      goodNote: 'With the default `SQL_Latin1_General_CP1_CI_AS` collation this conversion forces a scan. With a Windows collation SQL Server can still seek, but its row estimates get worse.' },

    { k: 'gb', id: 'sarg-or', t: '`OR` across two columns',
      bad: `
SELECT Id FROM dbo.Payments
WHERE BankRef = @ref
   OR EndToEndId = @ref;   -- ✗ often one scan`,

UNION                        -- ✓ two seeks,
SELECT Id FROM dbo.Payments  --   duplicates removed
WHERE EndToEndId = @ref;`,
      goodNote: 'SQL Server can sometimes combine two indexes for an `OR` by itself. Check the actual plan before you rewrite.' },

    { k: 'snip', id: 'sarg-like', t: '`LIKE`, wildcards and case', code: `

window.NCS.push({

        w: 680,
        minw: 520,
        actors: [{ l: 'App', k: 'a' }, { l: 'Plan cache', k: 's' }, { l: 'dbo.Orders', s: 'db' }],
        steps: [
          { f: 0, t: 1, l: 'EXEC GetOrders 42', mono: true },

  id: 'qs', code: 'QS', name: 'Query Store and live activity',
  blurb: 'Query Store records every query, its plans and its run-time numbers inside the database, so you can see what was slow last night. DMVs (dynamic management views, the `sys.dm_…` views) show what is running right now.',
  short: [
    'Query Store is on by default for new databases since SQL Server 2022 and in Azure SQL. Turn it on everywhere else.',
    'A query got slower after a deploy or an upgrade? Find its earlier plan in Query Store and force it.',
    'Wait types tell you what a slow query is waiting for: a lock, the disk, the CPU or the application.'
  ],
  blocks: [
    { k: 'sub', t: 'Query Store: what was slow' },

    { k: 'snip', id: 'qs-on', t: 'Turn on Query Store', code: `
ALTER DATABASE CURRENT SET QUERY_STORE = ON
    (OPERATION_MODE = READ_WRITE,
     QUERY_CAPTURE_MODE = AUTO,              -- skips trivial one-off queries
     MAX_STORAGE_SIZE_MB = 2048,
     INTERVAL_LENGTH_MINUTES = 15,
     WAIT_STATS_CAPTURE_MODE = ON);

SELECT actual_state_desc, readonly_reason, current_storage_size_mb, max_storage_size_mb
FROM sys.database_query_store_options;       -- READ_ONLY when full: raise the size` },

    { k: 'snip', id: 'qs-top', t: 'The heaviest queries of the last 24 hours', code: `
SELECT TOP (20) q.query_id, qt.query_sql_text,
       SUM(rs.count_executions) AS runs,
       SUM(rs.avg_cpu_time * rs.count_executions) / 1000 AS cpu_ms,
       SUM(rs.avg_duration * rs.count_executions) / 1000 AS duration_ms,
       SUM(rs.avg_logical_io_reads * rs.count_executions) AS reads
FROM sys.query_store_runtime_stats AS rs
JOIN sys.query_store_runtime_stats_interval AS i ON i.runtime_stats_interval_id = rs.runtime_stats_interval_id
JOIN sys.query_store_plan AS p ON p.plan_id = rs.plan_id
JOIN sys.query_store_query AS q ON q.query_id = p.query_id
JOIN sys.query_store_query_text AS qt ON qt.query_text_id = q.query_text_id
WHERE i.start_time >= DATEADD(hour, -24, SYSUTCDATETIME())
GROUP BY q.query_id, qt.query_sql_text
ORDER BY cpu_ms DESC;`,
      note: 'Times are stored in microseconds. SSMS shows the same data in the *Top Resource Consuming Queries* report.' },

    { k: 'snip', id: 'qs-force', t: 'Force the earlier, faster plan', code: `

       AVG(rs.avg_duration) / 1000 AS avg_ms, MAX(p.last_execution_time) AS last_run
FROM sys.query_store_plan AS p
JOIN sys.query_store_runtime_stats AS rs ON rs.plan_id = p.plan_id
WHERE p.query_id = 4711
GROUP BY p.plan_id, p.is_forced_plan, p.force_failure_count
ORDER BY avg_ms;

EXEC sys.sp_query_store_force_plan @query_id = 4711, @plan_id = 12;
EXEC sys.sp_query_store_unforce_plan @query_id = 4711, @plan_id = 12;`,
      note: 'A forced plan stops working when an index it uses is dropped: watch `force_failure_count`.' },

    { k: 'sub', t: 'Right now: requests and waits' },

    { k: 'snip', id: 'qs-now', t: 'What is running right now', code: `
SELECT r.session_id, s.login_name, s.program_name, r.status, r.command,
       r.wait_type, r.blocking_session_id, r.cpu_time, r.logical_reads,
       r.total_elapsed_time / 1000 AS elapsed_s,
       SUBSTRING(t.text, r.statement_start_offset / 2 + 1,
                 (CASE r.statement_end_offset WHEN -1 THEN DATALENGTH(t.text)
                       ELSE r.statement_end_offset END - r.statement_start_offset) / 2 + 1) AS statement_text,
       p.query_plan
FROM sys.dm_exec_requests AS r
JOIN sys.dm_exec_sessions AS s ON s.session_id = r.session_id
CROSS APPLY sys.dm_exec_sql_text(r.sql_handle) AS t
OUTER APPLY sys.dm_exec_query_plan(r.plan_handle) AS p
WHERE s.is_user_process = 1 AND r.session_id <> @@SPID

        ['`CXPACKET` / `CXCONSUMER`', 'parallel threads waiting for each other', 'uneven parallel plans, the `cost threshold for parallelism` and `MAXDOP` settings'],
        ['`SOS_SCHEDULER_YIELD`', 'queueing for CPU', 'the top CPU queries in Query Store'],

/* ===== Widgets of the SQL Server sheet: query order, join visualizer, window explorer, isolation levels, index simulator =====
   Each widget reads its data from its own card in the group files (block.query, block.kinds, block.levels, ...). */
(function () {
  var $, $$, esc, inl, seg, bindSeg, code, copy, hl;
  function use(kit) { $ = kit.$; $$ = kit.$$; esc = kit.esc; inl = kit.inl; seg = kit.seg; bindSeg = kit.bindSeg; code = kit.code; copy = kit.copy; hl = kit.hl; }

  /* ---- shared pieces ---- */
  /* a list of choices on the left (a select on a phone), same look as the built-in picker */
  function optList(items, cur, label) {
    return '<div class="coll-needs" role="group" aria-label="' + esc(label) + '">' + items.map(function (t, i) {
      return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === cur) + '">' + esc(t) + '</button>';
    }).join('') + '</div><label class="coll-sel"><span>' + esc(label) + '</span><select aria-label="' + esc(label) + '">' + items.map(function (t, i) {
      return '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select></label>';
  }
  function bindList(el, onPick) {
    function pick(i) {
      $('.coll-sel select', el).value = String(i);
      $$('.coll-needs button', el).forEach(function (x) { x.setAttribute('aria-pressed', String(+x.getAttribute('data-i') === i)); });
      onPick(i);
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.coll-needs button'); if (!b || !el.contains(b)) return;
      pick(+b.getAttribute('data-i'));
    });
    $('.coll-sel select', el).addEventListener('change', function () { pick(+this.value); });
  }
  /* a small data table; null cells read NULL */
  function tableHTML(cols, rows, cls, rowCls) {
    return '<table class="tbl ' + (cls || '') + '"><thead><tr>' + cols.map(function (c) { return '<th scope="col">' + esc(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (r, k) {
        return '<tr' + (rowCls ? rowCls(k) : '') + '>' + r.map(function (v, j) {
          return (v === null || v === undefined) ? '<td class="nul" data-l="' + esc(cols[j]) + '">NULL</td>' : '<td data-l="' + esc(cols[j]) + '">' + esc(v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }
  function setVerdict(el, kind, html) { var vl = $('.verdict-line', el); vl.className = 'verdict-line ' + kind; vl.innerHTML = html; }

  /* ---- qorder: step through the order SQL Server runs a query in ---- */
  function qorder(el, b, kit) {
    use(kit);
    var i = 0, n = b.steps.length;
    el.innerHTML = '<ol class="qo-chips" aria-label="Logical processing order">' + b.chips.map(function (c, k) {
      return '<li><button type="button" data-step="' + k + '"><span class="ix">' + (k + 1) + '</span>' + esc(c) + '</button></li>';
    }).join('') + '</ol>' +
      '<div class="ev-top"><pre class="ev-code" aria-label="Query"></pre><div class="ev-ctl">' +
      '<button type="button" class="tbtn" data-a="next">Step</button><button type="button" class="tbtn" data-a="prev">Back</button>' +
      '<button type="button" class="tbtn" data-a="reset">Reset</button><span class="ev-ct"></span></div></div>' +
      '<div class="tbl-wrap qo-out" aria-live="polite"></div><div class="verdict-line"></div>';
    function render() {
      var s = b.steps[i];
      $('.ev-code', el).innerHTML = b.query.map(function (ln, k) {
        return '<span class="ev-ln' + (k === s.line ? ' cur' : '') + '">' + (hl(ln, 'sql') || ' ') + '</span>';
      }).join('');
      $$('.qo-chips li', el).forEach(function (li, k) {
        li.className = k < i ? 'done' : k === i ? 'cur' : '';
        $('button', li).setAttribute('aria-current', k === i ? 'step' : 'false');
      });
      $('.qo-out', el).innerHTML = tableHTML(s.cols, s.rows, 'qo-tbl dt', function (k) { return s.gone.indexOf(k) > -1 ? ' class="gone"' : ''; });
      setVerdict(el, s.k || 'info', inl(s.note));
      $('.ev-ct', el).textContent = 'step ' + (i + 1) + ' of ' + n;
      $('[data-a="prev"]', el).disabled = i === 0;
      $('[data-a="next"]', el).disabled = i === n - 1;
    }
    el.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-a]');
      if (btn && el.contains(btn)) {
        var a = btn.getAttribute('data-a');
        i = a === 'reset' ? 0 : a === 'next' ? Math.min(n - 1, i + 1) : Math.max(0, i - 1);
        render(); return;
      }
      var chip = e.target.closest('.qo-chips button');
      if (chip && el.contains(chip)) { i = +chip.getAttribute('data-step'); render(); }
    });
    render();
  }
  qorder.text = function (b) { return b.chips.join(' ') + ' ' + b.query.join(' ') + ' ' + b.steps.map(function (s) { return s.note; }).join(' '); };

  /* ---- join: pick a join, see which rows survive ---- */
  function join(el, b, kit) {
    use(kit);
    var cust = b.customers, ord = b.orders, cur = 0;
    function match(c, o) { return o[1] !== null && o[1] === c[0]; }
    function pair(c, o) { return [c ? c[0] : null, c ? c[1] : null, o ? o[0] : null, o ? o[2] : null]; }
    function rows(kind) {
      var out = [];
      switch (kind) {
        case 'inner': cust.forEach(function (c) { ord.forEach(function (o) { if (match(c, o)) out.push(pair(c, o)); }); }); break;
        case 'left': cust.forEach(function (c) {
          var m = ord.filter(function (o) { return match(c, o); });
          if (m.length) m.forEach(function (o) { out.push(pair(c, o)); }); else out.push(pair(c, null));
        }); break;
        case 'right': ord.forEach(function (o) {
          var m = cust.filter(function (c) { return match(c, o); });
          if (m.length) m.forEach(function (c) { out.push(pair(c, o)); }); else out.push(pair(null, o));
        }); break;
        case 'full': out = rows('left'); ord.forEach(function (o) { if (!cust.some(function (c) { return match(c, o); })) out.push(pair(null, o)); }); break;
        case 'cross': cust.forEach(function (c) { ord.forEach(function (o) { out.push(pair(c, o)); }); }); break;
        case 'exists': cust.forEach(function (c) { if (ord.some(function (o) { return match(c, o); })) out.push([c[0], c[1]]); }); break;
        case 'notexists': cust.forEach(function (c) { if (!ord.some(function (o) { return match(c, o); })) out.push([c[0], c[1]]); }); break;
        case 'notin':
          var hasNull = ord.some(function (o) { return o[1] === null; });
          cust.forEach(function (c) { if (!hasNull && !ord.some(function (o) { return o[1] === c[0]; })) out.push([c[0], c[1]]); });
          break;
        case 'crossapply': case 'outerapply': cust.forEach(function (c) {
          var m = ord.filter(function (o) { return match(c, o); }).sort(function (x, y) { return y[0] - x[0]; });
          if (m.length) out.push(pair(c, m[0])); else if (kind === 'outerapply') out.push(pair(c, null));
        }); break;
      }
      return out;
    }
    el.innerHTML = '<div class="coll">' + optList(b.kinds.map(function (k) { return k.name; }), 0, 'Join') + '<div class="coll-out jn-out" aria-live="polite"></div></div>';
    function render() {
      var k = b.kinds[cur], r = rows(k.id), two = k.two;
      var usedC = {}, usedO = {};
      r.forEach(function (x) { if (x[0] !== null) usedC[x[0]] = 1; if (!two && x[2] !== null) usedO[x[2]] = 1; });

<script>
/*@@FILE kit/30-app.js@@*/
/* ===== Page builder: groups, sections, cards, widgets, nav, search, theme. All content comes from the sheet (window.NCS_*). ===== */
(function () {
  'use strict';
  var SECS = window.NCS || [], esc = DG.esc, META = window.NCS_META || {};

  var GROUPS = window.NCS_GROUPS || [], SEC = {};
  SECS.forEach(function (s) { SEC[s.id] = s; });
  GROUPS.forEach(function (g) {
    g.sections = g.secs.map(function (id) { if (!SEC[id]) console.error('Group lists an unknown section', id); return SEC[id]; }).filter(Boolean);

  /* languages: the kit's table, plus whatever the sheet adds or changes in NCS_LANGS */

  [window.NCS_LANGDEFS || {}, window.NCS_LANGS || {}].forEach(function (src) {

  function many(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  /* inline markup: `code`, **bold**, *italic* — never inside code spans */
  function inl(s) {
    return String(s == null ? '' : s).split('`').map(function (part, i) {
      if (i % 2) return '<code>' + esc(part) + '</code>';

        .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');

  }
  function plain(s) { return String(s || '').replace(/`/g, '').replace(/\*\*/g, ''); }

  /* ---- tiny syntax highlighter: one pass per line, driven by the language table ---- */
  var COM = { c: '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/', block: '\\/\\*[\\s\\S]*?\\*\\/', sql: '--[^\\n]*', hash: '#[^\\n]*', xml: '<!--[\\s\\S]*?-->', none: '(?!)' };

  function langOf(lang) {

      else if (m[2]) out += '<span class="tk-str">' + esc(t) + '</span>';
      else if (m[3]) out += '<span class="tk-num">' + esc(t) + '</span>';

        else if (d.types && /^[A-Z]/.test(t)) out += '<span class="tk-type">' + esc(t) + '</span>';
        else if (d.tag && /<\/?$/.test(before)) out += '<span class="tk-type">' + esc(t) + '</span>';
        else if (d.fn === 'key' && next === ':') out += '<span class="tk-fn">' + esc(t) + '</span>';

          b.rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td data-l="' + esc(plain(b.cols[i])) + '">' + inl(c) + '</td>'; }).join('') + '</tr>'; }).join('') +

  /* ---- groups, sections, nav ---- */

      '<span class="ct">' + cardsLabel(s.cards) + '</span><button class="sec-tg" type="button" aria-expanded="true" aria-controls="b-' + s.id + '" aria-label="Collapse ' + esc(s.name) + '">' + chev + '</button></div>' +
      '<p class="sec-blurb">' + inl(s.blurb) + '</p>' +
      (s.short ? '<div class="short"><p class="short-k">In short</p><ul>' + s.short.map(function (t) { return '<li>' + inl(t) + '</li>'; }).join('') + '</ul></div>' : '') +
      (s.subs.length ? '<div class="jump"><span class="jump-k">In this section</span>' + s.subs.map(function (b) {

  var PROG = META.prog && META.prog.lines && META.prog.lines.length ? META.prog : null;

      '<span class="tools"><span id="pmap-copy"></span></span></header>' +
      '<p class="prog-cap">' + inl(PROG.cap || 'Each tagged line jumps to the section that explains it.') + '</p>' +
      '<div class="prog-body"><div class="pmap" id="pmap"></div><ul class="prog-secs" id="prog-secs" aria-label="Sections this file touches"></ul></div></article>';

    });

  });
  $('#secs').innerHTML = sh;
  $('#nav').innerHTML = nav;
  $('#side-meta').textContent = many(CARDS, 'card') + ' · ' + many(SECS.length, 'section') + ' · ' + many(GROUPS.length, 'group');

  }

  /* ---- the map: one card per group, listing its sections and the tasks people come for ---- */
  var TASKS = (window.NCS_TASKS || []).map(function (row, i) {
    var ids = row[2].filter(function (id) { if (!IDX[id]) console.error('Task points at a missing card', id); return IDX[id]; });
    return { t: row[0], hint: row[1], ids: ids, sec: IDX[ids[0]].sec, i: i };
  });

    var tasks = TASKS.filter(function (t) { return t.sec.g === g; })
      .sort(function (a, b) { return g.sections.indexOf(a.sec) - g.sections.indexOf(b.sec) || a.i - b.i; });
    return '<article class="gcard" data-g="' + g.id + '"><header><h3><button type="button" data-to="g-' + g.id + '">' + esc(g.name) + '</button></h3>' +

      '<p class="glabel">Sections<span class="ct">' + cardsLabel(g.cards) + '</span></p><ul class="glist">' +
      (PROG && g.id === PROG.group ? '<li><button class="grow" type="button" data-to="prog"><span class="c">' + progCode + '</span><span class="n">' + progNav + '</span></button></li>' : '') +

        var seen = {}; seen[t.sec.id] = 1;
        var also = t.ids.slice(1).filter(function (id) { var s = IDX[id].sec; if (seen[s.id]) return false; seen[s.id] = 1; return true; });
        return '<li class="trow"><button class="grow" type="button" data-to="c-' + t.ids[0] + '" title="' + esc(plain(t.hint)) + '"><span class="c">' + t.sec.code + '</span><span class="n">' + inl(t.t) + '</span></button>' +
          also.map(function (id) {
            var b = IDX[id], label = b.sec.name + ': ' + plain(b.t);
            return '<button class="also" type="button" data-to="c-' + id + '" title="' + esc(label) + '" aria-label="Also in ' + esc(label) + '">' + b.sec.code + '</button>';
          }).join('') + '</li>';
      }).join('') + '</ul></details></article>';
  }).join('');
  $('#map-ct').textContent = many(SECS.length, 'section') + ' · ' + many(TASKS.length, 'task');
  /* on a phone the task lists start folded, so the six groups fit in a couple of screens */
  if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) $$('.gtasks').forEach(function (d) { d.removeAttribute('open'); });

  /* ======================= widgets ======================= */
  function segHTML(key, opts, cur, label) {
    return '<span class="seg" role="group" aria-label="' + esc(label) + '" data-k="' + key + '">' + opts.map(function (o) {
      return '<button type="button" data-v="' + esc(o) + '" aria-pressed="' + (o === cur) + '">' + esc(o) + '</button>';
    }).join('') + '</span>';
  }
  function bindSeg(root, onPick) {
    root.addEventListener('click', function (e) {
      var b = e.target.closest('.seg[data-k] button'); if (!b || !root.contains(b)) return;
      var seg = b.parentNode;
      $$('button', seg).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      onPick(seg.getAttribute('data-k'), b.getAttribute('data-v'));
    });
  }

  /* built-in "picker": choose what you need on the left, get the answer and its code on the right */
  function pickerWidget(el, b) {
    var C = b.items, cur = 0, label = b.label || 'What you need';
    el.innerHTML = '<div class="coll"><div class="coll-needs" role="group" aria-label="' + esc(label) + '">' + C.map(function (c, i) {
      return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(c.need) + '</button>';
    }).join('') + '</div><label class="coll-sel"><span>' + esc(b.prompt || 'I need to') + '</span><select aria-label="' + esc(label) + '">' + C.map(function (c, i) {
      return '<option value="' + i + '">' + esc(c.need) + '</option>';
    }).join('') + '</select></label><div class="coll-out" aria-live="polite"></div></div>';
    function render() {
      var c = C[cur];
      $('.coll-out', el).innerHTML = '<div class="ty"><span>' + esc(c.use) + '</span>' + (c.hint ? '<small>' + esc(c.hint) + '</small>' : '') +
        (c.code ? '<span style="margin-left:auto">' + cpBtn(b.id + ':' + cur, c.code, 'Copy example') + '</span>' : '') + '</div>' +
        (c.code ? codeBox(c.code, c.lang || b.lang || DEF) : '') + (c.why ? '<p><b>' + esc(b.watch || 'Watch out:') + '</b> ' + inl(c.why) + '</p>' : '');
    }
    el.addEventListener('click', function (e) {
      var btn = e.target.closest('.coll-needs button'); if (!btn) return;
      pick(+btn.getAttribute('data-i'));
    });
    $('select', el).addEventListener('change', function () { pick(+this.value); });
    function pick(i) {
      cur = i; $('select', el).value = String(i);
      $$('.coll-needs button', el).forEach(function (x) { x.setAttribute('aria-pressed', String(+x.getAttribute('data-i') === i)); });
      render();
    }
    render();
  }

  /* built-in "steps": an ordered list, with an optional second version that shows the classic mistakes */
  function stepsWidget(el, b) {
    var modes = b.modes || ['Right order', 'Broken order'], mode = modes[0], rails = b.rails;
    el.innerHTML = (b.bad ? '<div class="wdg-row">' + segHTML('m', modes, mode, b.label || 'Version') + '</div>' : '') +
      '<div class="mw' + (rails ? '' : ' mw-plain') + '">' + (rails ? '<div class="rail down" aria-hidden="true">' + esc(rails[0]) + '</div>' : '') +
      '<ol class="mw-list" aria-live="polite"></ol>' + (rails ? '<div class="rail up" aria-hidden="true">' + esc(rails[1]) + '</div>' : '') + '</div>' +
      (b.note ? '<p class="note" style="border:0;padding:0">' + inl(b.note) + '</p>' : '');
    function render() {
      var list = mode === modes[0] ? b.good : b.bad;
      $('.mw-list', el).innerHTML = list.map(function (x, i) {
        return '<li class="mw-i' + (x[2] ? ' ' + x[2] : '') + '"><span class="ix">' + (i + 1) + '</span><code>' + esc(x[0]) + '</code><span class="d">' + inl(x[1]) + '</span></li>';
      }).join('');
    }
    bindSeg(el, function (k, v) { mode = v; render(); });
    render();
  }

  /* a sheet adds its own widgets in NCS_WIDGETS: id -> function (el, block, kit) */
  var KIT = { $: $, $$: $$, esc: esc, inl: inl, plain: plain, seg: segHTML, bindSeg: bindSeg, code: codeBox, copy: cpBtn, hl: hlLine, lang: DEF };
  var WIDGETS = Object.assign({ picker: pickerWidget, steps: stepsWidget }, window.NCS_WIDGETS || {});
  $$('.wdg[data-w]').forEach(function (el) {
    try { WIDGETS[el.getAttribute('data-w')](el, IDX[el.closest('[data-id]').getAttribute('data-id')], KIT); }
    catch (err) { console.error('Widget failed', err); el.innerHTML = '<div class="dg-err">This widget failed to load: ' + esc(err.message) + '</div>'; }
  });

  /* ======================= interactions ======================= */
  var side = $('#side'), scrim = $('#scrim'), mb = $('#menu-btn');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function openNav() { document.body.classList.add('nav-open'); scrim.hidden = false; mb.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); scrim.hidden = true; mb.setAttribute('aria-expanded', 'false'); }
  function setShut(sec, on) {
    sec.classList.toggle('shut', on);
    var t = $('.sec-tg', sec); t.setAttribute('aria-expanded', String(!on));
    t.setAttribute('aria-label', (on ? 'Expand ' : 'Collapse ') + $('h2', sec).textContent);
  }
  function go(id) {
    var el = document.getElementById(id); if (!el) return;
    if (el.hidden && q.value) { q.value = ''; filter(); }
    var sec = el.closest('.sec'); if (sec && sec.classList.contains('shut')) setShut(sec, false);
    closeNav();
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (el.classList.contains('blk') || el.classList.contains('call') || el.classList.contains('sub')) { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1400); }
  }
  function copyText(btn, txt) {
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1300); };
    var fallback = function () {
      try { var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }
      catch (e) { btn.textContent = 'Select & copy'; }
    };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  }
  document.addEventListener('click', function (ev) {
    var cp = ev.target.closest('[data-copy]');
    if (cp) { copyText(cp, COPY[cp.getAttribute('data-copy')] || ''); return; }
    var t = ev.target.closest('[data-to]');
    if (t) { ev.preventDefault(); go(t.getAttribute('data-to')); return; }
    var sb = ev.target.closest('.blk[data-state] .blk-h .seg button');
    if (sb) {
      var card = sb.closest('.blk'), s = sb.getAttribute('data-s');
      card.setAttribute('data-state', s);
      $$('.seg button', card).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-s') === s)); });
      return;
    }
    var tg = ev.target.closest('.sec-tg');
    if (tg) { var sec = tg.closest('.sec'); setShut(sec, !sec.classList.contains('shut')); return; }
    var ngh = ev.target.closest('.nav-gh');
    if (ngh) { var ng = ngh.parentNode, shut = !ng.classList.contains('shut'); ng.classList.toggle('shut', shut); ngh.setAttribute('aria-expanded', String(!shut)); }
  });
  var allShut = false;
  $('#collapse-all').addEventListener('click', function () {
    allShut = !allShut;
    $$('.sec').forEach(function (s) { setShut(s, allShut); });
    this.setAttribute('aria-pressed', String(allShut));
    $('#collapse-lbl').textContent = allShut ? 'Expand all' : 'Collapse all';
  });

  /* theme */
  $('#theme-btn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    if (!cur) cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ncs-theme', next); } catch (e) { }
  });

  /* wrap long lines */
  var wrapBtn = $('#wrap-btn'), wrap = null;
  try { wrap = localStorage.getItem('ncs-wrap'); } catch (e) { }
  wrap = wrap === null ? !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches) : wrap === '1';
  function setWrap(on) { wrap = on; document.body.classList.toggle('wrap', on); wrapBtn.setAttribute('aria-pressed', String(on)); }
  setWrap(wrap);
  wrapBtn.addEventListener('click', function () { setWrap(!wrap); try { localStorage.setItem('ncs-wrap', wrap ? '1' : '0'); } catch (e) { } });

  /* mobile nav */
  mb.addEventListener('click', function () { document.body.classList.contains('nav-open') ? closeNav() : openNav(); });
  scrim.addEventListener('click', closeNav);

  /* ---- search ---- */
  var q = $('#ncs-q'), hits = $('#hits'), timer;
  q.placeholder = SEARCH.placeholder && !(window.matchMedia && window.matchMedia('(max-width: 760px)').matches) ? SEARCH.placeholder : 'Search the cheatsheet';
  var blocks = $$('.blks > [data-id]'), TEXT = {};
  function btext(b) {
    var parts = [b.sec.code, b.sec.name, b.t, b.v, b.code, b.bad, b.good, b.note, b.badNote, b.goodNote, b.cap, b.capB, b.capF, b.text, b.kw, b.call && b.call.text];
    if (b.rows) parts.push(b.cols.join(' '), b.rows.map(function (r) { return r.join(' '); }).join(' '));
    if (b.k === 'widget') {                                   /* what a widget shows is searchable too */
      if (b.items) parts.push(b.items.map(function (c) { return [c.need, c.use, c.hint, c.code, c.why].join(' '); }).join(' '));
      if (Array.isArray(b.good)) parts.push(b.good.concat(b.bad || []).map(function (x) { return x.join(' '); }).join(' '));
      var w = WIDGETS[b.w];                                   /* a custom widget can add its own search text */
      if (w && w.text) parts.push(typeof w.text === 'function' ? w.text(b) : w.text);
    }
    return parts.filter(Boolean).join(' ').toLowerCase();
  }
  blocks.forEach(function (el) { var id = el.getAttribute('data-id'); TEXT[id] = btext(IDX[id]); });
  function filter() {
    var terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean), n = 0, active = terms.length > 0;
    blocks.forEach(function (el) {
      var ok = !active || terms.every(function (t) { return TEXT[el.getAttribute('data-id')].indexOf(t) > -1; });
      el.hidden = !ok; if (ok && active && !el.classList.contains('call')) n++;
    });
    $$('.sec').forEach(function (s) {
      var vis = $$('.blks > [data-id]', s).some(function (b) { return !b.hidden; });
      s.hidden = !vis;
      var ni = $('.nav-i[data-to="' + s.id + '"]'); if (ni) ni.parentNode.hidden = !vis;
    });
    if (PROG) $('.nav-i[data-to="prog"]').parentNode.hidden = active;     /* the annotated file is not a search result */
    $$('.nav-g').forEach(function (g) { g.hidden = !$$('.nav-list li', g).some(function (li) { return !li.hidden; }); });
    /* a sub-heading stays only while one of the cards under it matches */
    $$('.blks').forEach(function (list) {
      var sub = null, any = false;
      Array.prototype.forEach.call(list.children, function (el) {
        if (el.classList.contains('sub')) { if (sub) sub.hidden = active && !any; sub = el; any = false; }
        else if (!el.hidden) any = true;
      });
      if (sub) sub.hidden = active && !any;
    });
    document.body.classList.toggle('searching', active);
    $('.hero').hidden = active; $('#map').hidden = active; $('#legend').hidden = active; if (PROG) $('#prog').hidden = active; $('#nav-top').hidden = active;
    $$('.gband').forEach(function (b) { b.hidden = active; });
    hits.hidden = !active; hits.textContent = n + ' / ' + CARDS;
    $('#empty').hidden = !(active && n === 0 && !$$('.blks > .call').some(function (c) { return !c.hidden; }));
  }
  q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(filter, 90); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; filter(); q.blur(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') closeNav();
  });

  /* ---- scroll spy ---- */
  var navItems = {}; $$('.nav-i[data-to]').forEach(function (b) { navItems[b.getAttribute('data-to')] = b; });
  $$('.nav-g').forEach(function (g) { navItems['g-' + g.getAttribute('data-g')] = $('.nav-gh', g); });   /* a group band lights its heading */
  var current = null;
  function mark(id) {
    if (current === id) return; current = id;
    $$('.nav-i.on, .nav-gh.on').forEach(function (b) { b.classList.remove('on'); });
    $$('.nav-g.cur').forEach(function (g) { g.classList.remove('cur'); });
    var b = navItems[id]; if (!b) return;
    b.classList.add('on');
    var grp = b.closest('.nav-g'); if (grp) grp.classList.add('cur');                                    /* the group you are in */
    var sr = side.getBoundingClientRect(), br = b.getBoundingClientRect();
    if (br.top < sr.top + 40 || br.bottom > sr.bottom - 40) side.scrollTop += br.top - sr.top - sr.height / 3;
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) mark(en.target.id); });
    }, { rootMargin: '-15% 0px -75% 0px' });
    $$('.sec, .gband').forEach(function (s) { io.observe(s); });
    io.observe($('#map')); io.observe($('#legend')); if (PROG) io.observe($('#prog'));
  }
})();
</script>
</body>
</html>
