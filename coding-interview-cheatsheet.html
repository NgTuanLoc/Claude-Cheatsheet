<style>
/*@@FILE kit/style.css@@*/
:root{
  color-scheme: light;
  --bg:#ffffff; --surface:#faf8f4; --surface-2:#f3efe7;
  --ink:#1d1a16; --ink-2:#4f4940; --ink-3:#81796d;
  --line:#ebe5da; --line-2:#d8d0c1;
  --accent:#95600a; --accent-fill:#e3a234; --accent-soft:#fbf1dc; --on-accent:#1d1a16;
  --rose:#bb1a4f; --rose-soft:#fdebf0;
  --teal:#0a766b; --teal-soft:#e2f3f0;
  --violet:#6a3ed2; --violet-soft:#efe9fd;
  --amber:#a86400; --amber-soft:#fdf1dc;
  --sky:#1d6aab; --sky-soft:#e6f0fa;
  --code-bg:#f8f5ef;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 6px 22px rgba(40,30,10,.07);
  --band-bg:#1d1a16; --band-edge:#1d1a16; --band-ink:#ffffff; --band-ink-2:#ddd6c9; --band-ink-3:#a89f90; --band-line:#6b655b; --band-hover:#35302a;
  --tk-kw:#7a3fc8; --tk-str:#0a766b; --tk-com:#8b8376; --tk-num:#b3580b; --tk-type:#1d6aab; --tk-fn:#8f5c06; --tk-at:#bb1a4f;
  --f-serif:'Fraunces',Georgia,'Times New Roman',serif;
  --f-sans:'Spline Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Spline Sans Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#15120e; --surface:#1c1813; --surface-2:#262019;
    --ink:#f2ede5; --ink-2:#c9c1b4; --ink-3:#9a9184;
    --line:#2d271f; --line-2:#3f372c;
    --accent:#ebb65c; --accent-fill:#e3a234; --accent-soft:#34270f; --on-accent:#15120e;
    --rose:#ff7d9c; --rose-soft:#3b1723;
    --teal:#52d3c0; --teal-soft:#0f302b;
    --violet:#b9a0ff; --violet-soft:#2a2044;
    --amber:#f4ab3e; --amber-soft:#36270d;
    --sky:#72b6f3; --sky-soft:#12283e;
    --code-bg:#1a1611;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.3);
    --band-bg:#2a231a; --band-edge:#4a4133; --band-ink:#f2ede5; --band-ink-2:#cfc7ba; --band-ink-3:#a39a8c; --band-line:#5d5343; --band-hover:#3b3125;
    --tk-kw:#c6a6ff; --tk-str:#72dccb; --tk-com:#8e8578; --tk-num:#f6a660; --tk-type:#82c1f6; --tk-fn:#ebb65c; --tk-at:#ff92ad; } }
:root[data-theme="dark"]{ color-scheme:dark;
    --bg:#15120e; --surface:#1c1813; --surface-2:#262019;
    --ink:#f2ede5; --ink-2:#c9c1b4; --ink-3:#9a9184;
    --line:#2d271f; --line-2:#3f372c;
    --accent:#ebb65c; --accent-fill:#e3a234; --accent-soft:#34270f; --on-accent:#15120e;
    --rose:#ff7d9c; --rose-soft:#3b1723;
    --teal:#52d3c0; --teal-soft:#0f302b;
    --violet:#b9a0ff; --violet-soft:#2a2044;
    --amber:#f4ab3e; --amber-soft:#36270d;
    --sky:#72b6f3; --sky-soft:#12283e;
    --code-bg:#1a1611;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.3);
    --band-bg:#2a231a; --band-edge:#4a4133; --band-ink:#f2ede5; --band-ink-2:#cfc7ba; --band-ink-3:#a39a8c; --band-line:#5d5343; --band-hover:#3b3125;
    --tk-kw:#c6a6ff; --tk-str:#72dccb; --tk-com:#8e8578; --tk-num:#f6a660; --tk-type:#82c1f6; --tk-fn:#ebb65c; --tk-at:#ff92ad; }

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-sans);font-feature-settings:"ss01"}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:5px}
code,kbd,pre{font-family:var(--f-mono)}
svg{flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,3vw,44px);padding-inline:clamp(16px,2.4vw,36px);max-width:1400px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;padding-block:22px 48px;padding-right:14px;border-right:1px solid var(--line);scrollbar-width:thin}
.side-brand{font:600 1.12rem/1.15 var(--f-serif);letter-spacing:-.01em;margin:0 0 4px 6px}
.side-meta{margin:0 0 12px 6px;font:500 11px/1.4 var(--f-mono);color:var(--ink-3)}
.nav-g{margin-top:12px}
.nav-gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px;cursor:pointer;text-align:left;border-radius:6px;font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav-gh:hover{background:var(--surface-2);color:var(--ink)}
.nav-g.cur .nav-gh{color:var(--ink)}
.nav-gh.on{background:var(--accent-soft);color:var(--ink)}
.nav-gh .chev{margin-left:auto;transition:transform .15s}
.nav-g.shut .chev{transform:rotate(-90deg)}
.nav-list{list-style:none;margin:2px 0 0 6px;padding:0 0 0 6px;border-left:1px solid var(--line)}
.nav-g.shut .nav-list{display:none}
.nav-i{display:flex;gap:6px;width:100%;background:none;border:0;padding:4px 8px;font-size:13.5px;color:var(--ink-2);text-align:left;cursor:pointer;border-radius:5px;line-height:1.35;align-items:baseline}
.nav-i .c{font:600 10.5px/1.7 var(--f-mono);color:var(--accent);flex:none;width:40px;letter-spacing:.04em}
.nav-i .n{flex:1;min-width:0}
.nav-i .ct{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent-fill)}
.nav-i.nav-top{font-weight:600;color:var(--ink)}
.main{min-width:0;padding-block:0 96px}
.scrim{position:fixed;inset:0;background:rgba(20,15,8,.42);z-index:40}

/* ---------- toolbar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 93%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.tbtn.menu-btn{display:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--ink)}
.tbtn.icon{padding:6px 8px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:9px;padding:0 8px 0 10px;background:var(--bg);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent-fill);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:8px 0;font:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search kbd{font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.hits{font:500 12px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-btn .sun{display:none}
  :root:not([data-theme="light"]) .theme-btn .moon{display:block}
}

/* ---------- hero ---------- */
.hero{padding-block:34px 4px;max-width:820px}
.eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
.hero h1{font:600 clamp(2.3rem,5.2vw,3.6rem)/1.02 var(--f-serif);font-variation-settings:"opsz" 144;letter-spacing:-.025em;margin:.28em 0 .3em;text-wrap:balance}
.lede{font-size:1.06rem;line-height:1.6;color:var(--ink-2);max-width:64ch;margin:0}
.now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px;max-width:820px}
.now-i{border-left:3px solid var(--c);background:var(--surface);border-radius:0 9px 9px 0;padding:8px 12px 9px;font-size:13px;line-height:1.45;color:var(--ink-2);min-width:0}
.now-i b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-bottom:1px}
.now-g{--c:var(--teal)} .now-b{--c:var(--rose)} .now-a{--c:var(--violet)}
@media (min-width:761px){ .now[data-n="1"]{grid-template-columns:minmax(0,1fr);max-width:420px} .now[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px} }

.legend{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 18px 16px;scroll-margin-top:76px}
.legend h2{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 12px}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 28px;font-size:13.8px;line-height:1.5;color:var(--ink-2)}
.howto li{min-width:0}
.howto .k{display:block;font:600 10.5px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.vkey{display:flex;flex-wrap:wrap;gap:6px}

/* program map */
.pmap{background:var(--code-bg);overflow-x:auto;padding:8px 0;font-size:12.6px;line-height:1.62;min-width:0}
.pl{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:stretch;min-width:max-content}
.pl.to{cursor:pointer}
.pl.to:hover,.pl.to.hot{background:var(--accent-soft)}
.pl code{white-space:pre;padding:0 16px 0 4px;color:var(--ink);font-size:inherit}
.pg{display:flex;align-items:center;justify-content:flex-end;padding:0 8px 0 0;border:0;background:none;font:600 10px/1 var(--f-mono);letter-spacing:.05em;color:var(--accent);cursor:pointer;border-right:1px solid var(--line)}
.pg:empty{cursor:default}
.pl.to:hover .pg{color:var(--ink)}

/* ---------- section headers ---------- */
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec-h .code{font:600 12px var(--f-mono);letter-spacing:.1em;color:var(--accent)}
.sec-h h2{font:600 clamp(1.5rem,3vw,2.05rem)/1.12 var(--f-serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sec-h .ct{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-3)}
.sec-tg{align-self:center;flex:none;width:28px;height:28px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-3)}
.sec-tg:hover{color:var(--ink);border-color:var(--ink-3)}
.sec-tg svg{transition:transform .15s}
.sec.shut .sec-tg svg{transform:rotate(-90deg)}
.sec.shut .blks,.sec.shut .short,.sec.shut .jump{display:none}
.sec-blurb{color:var(--ink-2);max-width:72ch;margin:10px 0 0}

/* ---------- sections & blocks ---------- */
.sec{margin-top:60px;scroll-margin-top:70px}
.blks{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;scroll-margin-top:76px;overflow:hidden}
.blk.flash{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);border-color:var(--accent-fill)}
.blk-h{display:flex;align-items:center;gap:8px 10px;padding:10px 10px 9px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.blk-h .bt{font:600 15px/1.35 var(--f-sans);margin:0;flex:1 1 14rem;min-width:0;letter-spacing:-.003em}
.blk-h .bt code,.note code,.tbl code,.call code,.sec-blurb code,.lede code,.legend code,.wdg code,.short code,.sub code,.gcard code,.prog-cap code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.blk-h .tools{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.ver{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.ver.v-new{background:var(--teal-soft);color:var(--teal)}
.ver.v-next{background:var(--violet-soft);color:var(--violet)}
.lang{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px}
.cp{border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:4px 9px;font:600 11px var(--f-sans);letter-spacing:.02em;cursor:pointer;color:var(--ink-2)}
.cp:hover{color:var(--ink);border-color:var(--ink-3)}
.src{margin:0;padding:10px 0;overflow-x:auto;font-size:12.8px;line-height:1.6;tab-size:4;color:var(--ink);background:var(--code-bg)}
.src code{display:inline-block;min-width:100%;background:none;padding:0;font-size:inherit}
.ln{display:block;padding:0 16px;min-height:1.6em;white-space:pre}
.ln-b{background:color-mix(in srgb,var(--rose) 11%,transparent);box-shadow:inset 3px 0 0 var(--rose)}
.ln-g{background:color-mix(in srgb,var(--teal) 11%,transparent);box-shadow:inset 3px 0 0 var(--teal)}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic}
.tk-num{color:var(--tk-num)} .tk-type{color:var(--tk-type)} .tk-fn{color:var(--tk-fn)} .tk-at{color:var(--tk-at)}
body.wrap .ln{white-space:pre-wrap;overflow-wrap:anywhere}
body.wrap .src code{display:block}
.note{margin:0;padding:9px 16px 11px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--bg)}

/* good vs bad */
.gb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.gb-c{min-width:0;display:flex;flex-direction:column}
.gb-c + .gb-c{border-left:1px solid var(--line)}
.gb-h{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;border-bottom:1px solid var(--line)}
.verdict{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.gb-b .verdict{background:var(--rose-soft);color:var(--rose)}
.gb-g .verdict{background:var(--teal-soft);color:var(--teal)}
.gb-h .cp{margin-left:auto}
.gb-c .src{flex:1}
.gb-c .note{border-top:1px solid var(--line)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45}
.tbl th{text-align:left;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);min-width:7rem}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl.mono1 td:first-child{font:600 12.5px/1.5 var(--f-mono)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface)}
.tbl .y{color:var(--teal);font-weight:600} .tbl .n{color:var(--rose);font-weight:600}

/* callouts */
.call{margin:0;padding:10px 14px 11px;border-radius:10px;font-size:14px;color:var(--ink);border:0}
.call .kl{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.call-trap{background:var(--amber-soft)} .call-trap .kl{color:var(--amber)}
.call-tip{background:var(--teal-soft)} .call-tip .kl{color:var(--teal)}
.call-key{background:var(--violet-soft)} .call-key .kl{color:var(--violet)}

/* diagram frame */
.dgf{margin:0}
.dgf-top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.dgf figcaption{font-size:13.5px;color:var(--ink-2);flex:1 1 16rem;min-width:0;line-height:1.45}
.dgf figcaption b{font-weight:600;color:var(--ink)}
.dg-scroll{overflow-x:auto;padding:12px 10px 10px;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dg-scroll svg{display:block;width:100%;height:auto;margin:0 auto}
.dg-err{padding:12px;color:var(--rose);font:12px var(--f-mono)}
.blk[data-state="b"] .st-f,.blk[data-state="f"] .st-b{display:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;background:var(--bg);flex:none}
.seg button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer;line-height:1.5}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg button[data-s="b"][aria-pressed="true"]{background:var(--rose-soft);color:var(--rose)}
.seg button[data-s="f"][aria-pressed="true"]{background:var(--teal-soft);color:var(--teal)}

/* ---------- widgets ---------- */
.wdg{padding:14px 16px 16px;display:grid;gap:14px;min-width:0}
.wdg-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.wdg-lbl{font:500 13px/1.3 var(--f-sans);color:var(--ink-2);min-width:11.5rem}
.wdg-code{font:500 12.5px/1.6 var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre;color:var(--ink)}
.verdict-line{padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.verdict-line.ok{background:var(--teal-soft)} .verdict-line.warn{background:var(--amber-soft)} .verdict-line.bad{background:var(--rose-soft)}
.verdict-line b{font-weight:600}

/* picker widget */
.coll{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:14px;align-items:start}
.coll-needs{display:grid;gap:4px}
.coll-needs button{text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;color:var(--ink-2);line-height:1.35}
.coll-needs button:hover{background:var(--surface-2);color:var(--ink)}
.coll-needs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--ink);font-weight:600}
.coll-out{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.coll-out .ty{padding:10px 14px;border-bottom:1px solid var(--line);font:600 15px/1.4 var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;background:var(--surface)}
.coll-out .ty small{font:500 12px var(--f-sans);color:var(--ink-3)}
.coll-out p{margin:0;padding:9px 14px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line)}
.coll-out p b{color:var(--ink)}

/* steps widget */
.mw{display:grid;grid-template-columns:22px minmax(0,1fr) 22px;gap:0 10px}
.mw.mw-plain{grid-template-columns:minmax(0,1fr)}
.rail{display:flex;flex-direction:column;align-items:center;font:600 10px/1.2 var(--f-mono);color:var(--ink-3);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.08em;text-transform:uppercase;border-radius:11px;background:var(--surface-2);padding:10px 0;justify-content:space-between}
.rail.down{color:var(--sky)} .rail.up{color:var(--teal);transform:rotate(180deg)}
.mw-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.mw-i{display:grid;grid-template-columns:26px minmax(0,13.5rem) minmax(0,1fr);gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--bg)}
.mw-i .ix{font:600 11px var(--f-mono);color:var(--ink-3)}
.mw-i code{font:600 12.5px/1.45 var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.mw-i .d{font-size:13.5px;color:var(--ink-2)}
.mw-i.bad{border-color:var(--rose);background:var(--rose-soft)}
.mw-i.bad .d{color:var(--ink)}
.mw-i.bad .d b{color:var(--rose)}
.mw-i.term{border-style:dashed}

.empty{margin-top:40px;padding:26px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;color:var(--ink-3)}
.foot{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;max-width:78ch}

/* ---------- responsive ---------- */
@media (min-width:1260px){
  .blks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .blk{grid-column:1/-1}
  .blk.half{grid-column:auto}
}
@media (max-width:1120px){ .app{grid-template-columns:230px minmax(0,1fr)} }
@media (max-width:960px){
  .app{display:block}
  .side{position:fixed;inset:0 auto 0 0;height:auto;width:min(86vw,320px);z-index:50;background:var(--bg);transform:translateX(-104%);transition:transform .2s ease;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 48px 12px;box-shadow:var(--shadow);visibility:hidden}
  body.nav-open .side{transform:none;visibility:visible}
  .tbtn.menu-btn{display:inline-flex}
  .howto{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .now{grid-template-columns:minmax(0,1fr)}
  .gb{grid-template-columns:minmax(0,1fr)}
  .gb-c + .gb-c{border-left:0;border-top:1px solid var(--line)}
  .coll{grid-template-columns:minmax(0,1fr)}
  .coll-needs{display:flex;flex-wrap:wrap;gap:6px}
  .coll-needs button{border-color:var(--line-2);border-radius:999px;padding:4px 11px;font-size:13px}
  .mw{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mw-i{grid-template-columns:22px minmax(0,1fr)}
  .mw-i .d{grid-column:2}
  .top .tbtn .lbl{display:none}
  .howto{grid-template-columns:minmax(0,1fr)}
  .wdg-lbl{min-width:0;flex-basis:100%}
  .blk-h{padding-left:14px}
  .ln{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
@media print{
  .side,.top,.scrim,.cp,.sec-tg{display:none!important}
  .app{display:block}
  .sec.shut .blks{display:grid!important}
  .blk{break-inside:avoid-page}
  .ln{white-space:pre-wrap}
}

/* ---------- additions ---------- */
.blks > .call{grid-column:1/-1}
.call.flash{box-shadow:0 0 0 3px var(--accent-soft)}
body.searching .sec.shut .blks{display:grid}
.vkey{display:flex;flex-direction:column;gap:6px}
.vk{display:grid;grid-template-columns:5.8rem minmax(0,1fr);gap:8px;align-items:center}
.vk .ver{justify-self:start}
.foot p{margin:.5em 0}
.foot a{color:var(--accent);text-underline-offset:2px}
.legend kbd{font:500 11px var(--f-mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;background:var(--bg)}

@media (max-width:760px){
  .top{flex-wrap:nowrap;gap:6px}
  .top .search{flex:1 1 110px}
  .top .search kbd{display:none}
  .top .tbtn{padding:6px 8px}
  .pmap{font-size:11.5px}
}

@media (max-width:1259px){
  .gb{grid-template-columns:minmax(0,1fr)}
  .gb-c + .gb-c{border-left:0;border-top:1px solid var(--line)}
  .coll{grid-template-columns:minmax(0,1fr)}
  .coll-needs{display:flex;flex-wrap:wrap;gap:6px}
  .coll-needs button{border-color:var(--line-2);padding:5px 10px;font-size:13px}
}

.coll-sel{display:none}
@media (max-width:760px){
  .coll-needs{display:none}
  .coll-sel{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
  .coll-sel select{flex:1;min-width:0;font:500 14px var(--f-sans);color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{padding:9px 14px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:1px 0;min-width:0}
  .tbl td:first-child{margin-bottom:2px}
  .tbl td:not(:first-child)::before{content:attr(data-l) " ";font:600 10px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
  .tbl tbody tr:hover td{background:none}
}

.dg{font-family:var(--f-sans);overflow:visible}
.dg text{fill:var(--ink)}
.dg .t-b{font-weight:600}
.dg .t-l{fill:var(--ink-2)}
.dg .t-s{fill:var(--ink-3)}
.dg .t-m{font-family:var(--f-mono)}
.dg .tn-m{fill:var(--ink-3)}
.dg .tk{fill:var(--k)}
.dg .k-n{--k:var(--ink-3);--kf:var(--bg)}
.dg .k-b{--k:var(--rose);--kf:var(--rose-soft)}
.dg .k-g{--k:var(--teal);--kf:var(--teal-soft)}
.dg .k-w{--k:var(--amber);--kf:var(--amber-soft)}
.dg .k-a{--k:var(--violet);--kf:var(--violet-soft)}
.dg .k-s{--k:var(--sky);--kf:var(--sky-soft)}
.dg .k-m{--k:var(--line-2);--kf:var(--surface-2)}
.dg .nd{fill:var(--kf);stroke:var(--k);stroke-width:1.3}
.dg .nd.dash{stroke-dasharray:5 4}
.dg .nd-l{fill:none;stroke:var(--k);stroke-width:1.2}
.dg .eg{fill:none;stroke:var(--k);stroke-width:1.5}
.dg .eg.k-n{stroke:var(--ink-3)}
.dg .eg.dash{stroke-dasharray:5 4}
.dg .ah{fill:var(--k)}
.dg .lbg{fill:var(--surface);opacity:.95}
.dg .ll{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.dg .grid{stroke:var(--line);stroke-width:1}
.dg .axis{stroke:var(--line-2);stroke-width:1}
.dg .grpbox{fill:none;stroke:var(--k);stroke-width:1.2;stroke-dasharray:6 4}
.dg .grpfill{fill:var(--kf);opacity:.45}
.dg .nt{fill:var(--kf);stroke:var(--k);stroke-width:1}
.dg .dv{stroke:var(--k);stroke-width:1;stroke-dasharray:2 4}
.dg .pillbg{fill:var(--surface);stroke:var(--k);stroke-width:1}
.dg .bdg{fill:var(--k)}
.dg .bdgt{fill:var(--bg);font-weight:700}
.dg .xm-c{fill:var(--kf);stroke:var(--k);stroke-width:1.4}
.dg .xm-l{stroke:var(--k);stroke-width:1.8;stroke-linecap:round}
.dg .bar{fill:var(--kf);stroke:var(--k);stroke-width:1.2}
.dg .bar.wait{stroke-dasharray:4 3;fill-opacity:.55}
.dg .mk{stroke:var(--k);stroke-width:1.2;stroke-dasharray:4 3}
.dg .pt{fill:var(--k);stroke:var(--bg);stroke-width:2}
.dg .ln-s{fill:none;stroke:var(--k);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.dg .ln-s.dash{stroke-dasharray:6 4}
.dg .ar{fill:var(--k);opacity:.12}

/* ---------- map: one card per group, with its sections and tasks ---------- */
.map{margin-top:40px;scroll-margin-top:70px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;margin-top:18px;align-items:start}
.gcard{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;overflow:hidden}
.gcard header{padding:13px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.gcard h3{margin:0;font:600 1.22rem/1.2 var(--f-serif);letter-spacing:-.005em}
.gcard h3 button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;text-align:left}
.gcard h3 button:hover{color:var(--accent)}
.gcard .gq{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.glabel,.gtasks summary{display:flex;align-items:center;gap:8px;margin:0;padding:10px 16px 2px;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.glabel .ct,.gtasks summary .ct{margin-left:auto;font-weight:500;letter-spacing:.02em;text-transform:none}
.glist{list-style:none;margin:0;padding:2px 6px 8px}
.grow{display:flex;gap:6px;align-items:baseline;width:100%;min-width:0;background:none;border:0;border-radius:6px;padding:4px 10px;font-size:13.5px;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer}
.grow .c{font:600 10.5px/1.7 var(--f-mono);color:var(--accent);flex:none;width:44px;letter-spacing:.04em}
.grow .n{flex:1;min-width:0}
.grow .ct{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.grow:hover{background:var(--accent-soft)}
.gtasks{border-top:1px solid var(--line)}
.gtasks summary{cursor:pointer;list-style:none;padding-bottom:4px}
.gtasks summary::-webkit-details-marker{display:none}
.gtasks summary::before{content:"";flex:none;width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.gtasks[open] summary::before{transform:rotate(45deg)}
.gtasks summary:hover{color:var(--ink)}
.gtasks:not([open]) summary{padding-bottom:11px}
.trow{display:flex;align-items:baseline;gap:4px;padding-right:6px}
.trow .grow{flex:1}
.also{flex:none;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:0 7px;font:600 10px/1.75 var(--f-mono);letter-spacing:.04em;color:var(--ink-3);cursor:pointer}
.also::before{content:"+ "}
.also:hover{border-color:var(--accent-fill);color:var(--ink);background:var(--accent-soft)}

/* ---------- group band: the divider that starts each group ---------- */
.gband{margin-top:76px;padding:18px 22px 20px;border-radius:14px;background:var(--band-bg);color:var(--band-ink);border:1px solid var(--band-edge);scroll-margin-top:70px}
.gband .gk{margin:0;font:600 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-fill)}
.gband h2{margin:.2em 0 .14em;font:600 clamp(1.7rem,3.6vw,2.4rem)/1.08 var(--f-serif);font-variation-settings:"opsz" 144;letter-spacing:-.018em;text-wrap:balance}
.gband .gq{margin:0;font-size:1.03rem;line-height:1.5;color:var(--band-ink-2)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--band-line);background:none;border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;line-height:1.5;color:var(--band-ink);cursor:pointer}
.gchip .c{font:600 10px var(--f-mono);letter-spacing:.04em;color:var(--band-ink-3)}
.gchip:hover{background:var(--band-hover)}
.gband + .sec{margin-top:34px}

/* ---------- section opening: takeaways and jump links ---------- */
.short{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 16px 12px}
.short-k,.jump-k{margin:0;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.short ul{list-style:none;margin:7px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px}
.short li{position:relative;padding-left:15px;font-size:13.8px;line-height:1.45;color:var(--ink);min-width:0}
.short li::before{content:"";position:absolute;left:0;top:.52em;width:7px;height:7px;border-radius:2px;background:var(--accent-fill)}
.jump{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.jump-k{margin-right:4px}
.jchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 10px 3px 11px;font-size:12.5px;line-height:1.5;color:var(--ink);cursor:pointer}
.jchip .n{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.jchip:hover{border-color:var(--accent-fill);background:var(--accent-soft)}

/* sub-heading inside a long section */
.sub{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin:20px 0 0;font:600 1.18rem/1.25 var(--f-serif);letter-spacing:-.005em;color:var(--ink);scroll-margin-top:76px;min-width:0}
.sub::after{content:"";order:1;flex:1;align-self:center;height:1px;background:var(--line-2);min-width:12px}
.sub .n{order:2;flex:none;font:500 11px var(--f-mono);letter-spacing:.02em;color:var(--ink-3)}
.blks > .sub:first-child{margin-top:6px}
.sub.flash > span:first-child{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);border-radius:3px}

/* a trap, tip or key point that belongs to one card is its last strip */
.blk > .call{border-radius:0;border-top:1px solid var(--line);padding:10px 16px 11px}

/* while searching, results stay tight */
body.searching .short,body.searching .jump{display:none}

/* legend chips and inline keys */
.lk{display:inline-block;font:600 10px/1.5 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;padding:1px 7px;border-radius:5px;margin-right:3px}
.lk-trap{background:var(--amber-soft);color:var(--amber)} .lk-tip{background:var(--teal-soft);color:var(--teal)} .lk-key{background:var(--violet-soft);color:var(--violet)}

@media (max-width:860px){
  .short ul{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (max-width:760px){
  .gband{margin-top:56px;padding:16px 16px 18px}
  .short{padding:10px 14px 12px}
  .blk > .call{padding:10px 14px 11px}
  .sub{font-size:1.1rem}
}
@media print{
  .gband{background:none;color:var(--ink);border:2px solid var(--ink)}
  .gband .gk,.gband .gq,.gchip,.gchip .c{color:var(--ink)}
  .jump{display:none}
}

/* ---------- the annotated file that can open a group ---------- */
.prog{margin-top:34px}
.prog-cap{margin:0;padding:9px 16px 10px;font-size:13.5px;line-height:1.5;color:var(--ink-2);border-bottom:1px solid var(--line);background:var(--surface)}
.prog-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,17.5rem)}
.prog-secs{list-style:none;margin:0;padding:8px 6px;border-left:1px solid var(--line);align-content:start}
.prog-secs .glabel{padding:4px 10px 4px}
.prog-secs .grow.hot{background:var(--accent-soft)}
@media (max-width:1120px){
  .prog-body{grid-template-columns:minmax(0,1fr)}
  .prog-secs{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr))}
  .prog-secs .glabel{grid-column:1/-1}
}

/* section header on a phone: title and toggle share one row */
@media (max-width:760px){
  .sec .sec-h{flex-wrap:nowrap}
  .sec .sec-h h2{flex:1;min-width:0}
  .sec .sec-h .ct{display:none}
}
/*@@FILE sheet/sheet.css@@*/
/* ===== Coding Interview Cheatsheet: styles for its own widgets. Tokens only, so both themes work. ===== */

/* problem and guide cards fill their own padding */
.wdg[data-w="problem"],.wdg[data-w="guide"]{padding:0;display:block}

/* LeetCode tag and difficulty, shown in a problem card's header */
.lc{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);letter-spacing:.03em;color:var(--accent);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px;text-decoration:none;white-space:nowrap}
a.lc:hover{border-color:var(--accent-fill);background:var(--accent-soft)}
.lc.lc-none{color:var(--ink-3)}
.dif{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);padding:4px 7px;border-radius:999px;white-space:nowrap}
.dif.d-e{background:var(--teal-soft);color:var(--teal)}
.dif.d-m{background:var(--amber-soft);color:var(--amber)}
.dif.d-h{background:var(--rose-soft);color:var(--rose)}
.dif.d-p{background:var(--violet-soft);color:var(--violet)}

/* the plain-words explanation on a problem card */
.px code,.gd code,.trc-f code,.pi-row code,.coll-to code,.stp-say code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.px{container-type:inline-size;padding:8px 16px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.px-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 30px}
@container (min-width:760px){ .px-cols{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)} }
.px dl{margin:0;min-width:0}
.px-r{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:2px 12px;padding:7px 0;border-top:1px dashed var(--line)}
.px dl:first-child .px-r:first-child{border-top:0}
@container (min-width:760px){ .px dl .px-r:first-child{border-top:0} }
.px dt{font:600 10px/1.9 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.px dd{margin:0;font-size:13.8px;line-height:1.55;color:var(--ink-2);min-width:0}
.px-r.px-idea dd{color:var(--ink)}
.px-r.px-cost dd{font:500 12.8px/1.6 var(--f-mono);color:var(--ink)}
.px dd ol{margin:0;padding-left:1.25em}
.px dd ol li{padding-left:2px}
.px dd ol li + li{margin-top:2px}
.px dd ol li::marker{color:var(--accent);font:600 12px var(--f-mono)}
.px-ex{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.px-ex + .px-ex{margin-top:5px}
.px-ex code{font-size:12.4px!important;color:var(--ink)}
.px-to{color:var(--accent);font-weight:600}
.px-why{flex-basis:100%;font-size:13px;color:var(--ink-3)}
@container (max-width:520px){
  .px-r{grid-template-columns:minmax(0,1fr);gap:1px;padding:6px 0}
  .px dt{line-height:1.5}
}

/* worked examples: one row per step of the algorithm */
.trc-f{margin:10px 0 0;min-width:0}
.trc-f figcaption{font-size:13px;color:var(--ink-2);margin:0 0 6px}
.trc-f figcaption b{font:600 10px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.trc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:fit-content;max-width:100%}
.trc{border-collapse:collapse;font:500 12px/1.45 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.trc th{text-align:left;font:600 9.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:7px 12px 6px;border-bottom:1px solid var(--line-2);vertical-align:bottom;background:var(--surface-2)}
.trc td{padding:5px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.trc tr:last-child td{border-bottom:0}
.trc-desc td:last-child{font-family:var(--f-sans);font-size:12.6px;color:var(--ink-2)}
.trc tr.hit td{background:var(--teal-soft);color:var(--ink)}
.trc code{font-size:1em!important;background:none!important;padding:0!important}
.trc-note{margin:6px 2px 0;font-size:12.8px;color:var(--ink-3)}

/* "How it works" cards */
.blk:has(> .wdg[data-w="guide"]){border-color:color-mix(in srgb,var(--accent-fill) 45%,var(--line))}
.blk:has(> .wdg[data-w="guide"]) > .blk-h{background:var(--accent-soft);border-bottom-color:color-mix(in srgb,var(--accent-fill) 35%,var(--line))}
.gd{container-type:inline-size;padding:14px 16px 16px;display:grid;gap:12px}
.gd-idea{margin:0;font-size:15px;line-height:1.6;color:var(--ink);max-width:78ch}
.gd-cols,.gd-foot{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 30px}
@container (min-width:700px){ .gd-cols,.gd-foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.gd h5{margin:0 0 5px;font:600 10px/1.4 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gd ul,.gd ol{margin:0;padding-left:1.2em;font-size:13.8px;line-height:1.55;color:var(--ink-2)}
.gd li + li{margin-top:3px}
.gd ol li::marker{color:var(--accent);font:600 12px var(--f-mono)}
.gd-mis li::marker{color:var(--rose)}
.gd-ex,.gd-cost p{margin:0;font-size:13.8px;line-height:1.55;color:var(--ink-2)}
.gd .trc-f{margin:0}

/* pickers with many options: wrapped pills above the answer at every width (a select on phones, as the kit does) */
.coll.pills{grid-template-columns:minmax(0,1fr)}
.coll.pills .coll-needs{display:flex;flex-wrap:wrap;gap:6px}
.coll.pills .coll-needs button{border-color:var(--line-2);border-radius:999px;padding:4px 11px;font-size:13px}
@media (max-width:760px){ .coll.pills .coll-needs{display:none} }

/* pickers: chips that jump to the cards using the answer */
.coll-to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px 14px 11px;border-top:1px solid var(--line)}
.coll-to-k{font:600 10px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink);line-height:1.5;text-align:left}
.chipbtn .c{font:600 10px var(--f-mono);color:var(--accent);letter-spacing:.04em}
.chipbtn:hover{border-color:var(--accent-fill);background:var(--accent-soft)}

/* budget table */
.tbl .w{color:var(--amber);font-weight:600}
.tbl.bud td:nth-child(2),.tbl.bud td:nth-child(3){font-family:var(--f-mono);font-size:12.5px}
.tbl.bud td:nth-child(2){white-space:nowrap}
.tbl.bud td:first-child{font-family:var(--f-mono);font-size:13px}

/* segmented controls wrap inside widgets on narrow screens */
.wdg > *{min-width:0}
.wdg .seg{flex-wrap:wrap;max-width:100%}

/* steppers */
.stp-view{min-width:0;display:grid;gap:8px}
.stp-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stp-b{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:5px 11px;font:600 12.5px/1.4 var(--f-sans);color:var(--ink-2);cursor:pointer}
.stp-b:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.stp-b:disabled{opacity:.42;cursor:default}
.stp-b.stp-go{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--ink)}
.stp-pos{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--ink-3)}
.stp-say{min-height:3.1em}
.stp-say code{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.stp-lbl{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stp-meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--ink-2)}
.stp-meta.col{flex-direction:column;align-items:flex-start;gap:8px}
.stp-meta b{color:var(--ink);font-weight:600}
.stp-meta code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.stp-meta.ops{gap:5px}
.schip{display:inline-flex;align-items:center;font:500 11.5px/1.5 var(--f-mono);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.schip.none{color:var(--ink-3);border-style:dashed;background:none}
.schip.st{border-color:var(--sky);background:var(--sky-soft);color:var(--ink)}
.schip.out{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.schip.cur{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--ink);font-weight:600}
.schip.past{opacity:.5}
.wdg-srcbox .src{border:1px solid var(--line);border-radius:8px;font-size:12.3px}

/* array cells */
.cells{display:flex;flex-wrap:wrap;gap:4px 5px;padding:2px 0}
.cell{display:grid;grid-template-rows:15px 34px 15px;justify-items:center;align-items:center;min-width:36px}
.cell-v{display:grid;place-items:center;min-width:36px;height:34px;padding:0 7px;border:1.5px solid var(--line-2);border-radius:7px;background:var(--bg);font:600 13px var(--f-mono);color:var(--ink);transition:background .15s,border-color .15s}
.cells.sm .cell{grid-template-rows:0 30px 15px}
.cells.sm .cell-v{height:30px}
.cell-top{font:600 10px var(--f-mono);color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.cell-bot{font:500 10px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.cell.dim .cell-v{opacity:.33}
.cell.ghost .cell-v{border-style:dashed;color:var(--ink-3);font-weight:500;font-size:11px}
.cell.on .cell-v{border-color:var(--accent-fill);background:var(--accent-soft)}
.cell.win .cell-v{border-color:var(--sky);background:var(--sky-soft)}
.cell.hit .cell-v{border-color:var(--teal);background:var(--teal-soft)}
.cell.bad .cell-v{border-color:var(--rose);background:var(--rose-soft)}

/* heap and tree drawings */
.hp-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:center}
.hp-wrap.tr{grid-template-columns:minmax(0,400px) minmax(0,1fr)}
.hp{width:100%;height:auto;display:block;font-family:var(--f-mono)}
.hp-e{stroke:var(--line-2);stroke-width:1.6}
.hp-n circle{fill:var(--bg);stroke:var(--ink-3);stroke-width:1.5}
.hp-n text{fill:var(--ink);font-size:13px;font-weight:600}
.hp-n.root circle{stroke:var(--violet)}
.hp-n.on circle{fill:var(--accent-soft);stroke:var(--accent-fill);stroke-width:2.4}
.hp-n.done circle{fill:var(--teal-soft);stroke:var(--teal)}
.hp-n.stk circle{fill:var(--sky-soft);stroke:var(--sky)}
.hp .hp-i{fill:var(--ink-3);font-size:10px;font-weight:600}

/* grid search */
.gsearch{display:grid;gap:3px;max-width:420px}
.gc{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;background:var(--surface);border:1px solid var(--line);font:600 11px var(--f-mono);color:var(--ink-2);min-width:0}
.gc.wall{background:var(--ink-3);border-color:var(--ink-3);opacity:.75}
.gc.seen{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent-fill) 55%,transparent);color:var(--ink)}
.gc.front{background:var(--amber-soft);border:1.5px dashed var(--amber)}
.gc.path{background:var(--teal-soft);border:1.5px solid var(--teal);color:var(--ink)}
.gc.cur{box-shadow:0 0 0 2px var(--accent-fill);position:relative;z-index:1}
.gc.end{font-weight:700;color:var(--ink)}
.gkey{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.gkey i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:6px}
.gkey .k-seen{background:var(--accent-soft);border:1px solid var(--accent-fill)}
.gkey .k-front{background:var(--amber-soft);border:1px dashed var(--amber)}
.gkey .k-path{background:var(--teal-soft);border:1px solid var(--teal)}

/* DP table */
.dpt{border-collapse:separate;border-spacing:3px;font:600 13px var(--f-mono)}
.dpt th{color:var(--ink-3);font-weight:600;padding:2px 6px;text-align:center;border-radius:5px}
.dpt th.on{color:var(--ink);background:var(--accent-soft)}
.dpt td{width:34px;height:32px;text-align:center;border:1.5px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--ink)}
.dpt td.blank{background:var(--surface);border-style:dashed}
.dpt td.dep{border-color:var(--sky);background:var(--sky-soft)}
.dpt td.cur{border-color:var(--accent-fill);background:var(--accent-soft)}
.dpt td.hit{border-color:var(--teal);background:var(--teal-soft)}

/* problem list */
.pi-bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.pi-bar .wdg-row .wdg-lbl{min-width:0}
.pi-sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0;max-width:100%}
.pi-sel select{min-width:0;max-width:100%;font:500 13.5px var(--f-sans);color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px}
.pi-count{margin:0;font:500 12px var(--f-mono);color:var(--ink-3)}
.pi-list{display:grid;gap:6px;max-height:min(74vh,760px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.pi-row{display:grid;gap:3px;text-align:left;width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px 10px;background:var(--bg);cursor:pointer;color:var(--ink);font:inherit}
.pi-row:hover{border-color:var(--accent-fill);background:var(--accent-soft)}
.pi-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.pi-h b{font-size:14.5px;font-weight:600}
.pi-n{font:600 11px var(--f-mono);color:var(--accent);min-width:3.4rem}
.pi-tech{font-size:12.5px;color:var(--ink-3)}
.pi-sec{margin-left:auto;font:600 10.5px var(--f-mono);letter-spacing:.05em;color:var(--ink-3)}
.pi-ask{font-size:13.4px;line-height:1.5;color:var(--ink-2)}
.pi-idea{font-size:13px;line-height:1.5;color:var(--ink)}
.pi-idea .pi-lbl{font:600 9.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:5px}
.pi-cost{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.pi-none{margin:6px 0;color:var(--ink-3)}

@media (max-width:760px){
  .hp-wrap,.hp-wrap.tr{grid-template-columns:minmax(0,1fr)}
  .cell{min-width:31px}
  .cell-v{min-width:31px;padding:0 4px;font-size:12px}
  .cells{gap:4px 3px}
  .stp-b{padding:5px 9px}
  .tbl.bud td:nth-child(2),.tbl.bud td:nth-child(3){white-space:normal}
  .dpt td{width:30px;height:29px}
  .trc{font-size:11.5px}
  .trc th,.trc td{padding-left:6px;padding-right:6px}
  .trc-desc td:last-child{min-width:7.5rem;font-size:12px}
  .pi-bar .wdg-row{gap:6px 10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Contents">
    <div class="side-brand" id="side-brand"></div>
    <p class="side-meta" id="side-meta">&nbsp;</p>
    <div id="nav-top">
      <button class="nav-i nav-top" type="button" data-to="map"><span class="c">MAP</span><span class="n">Sections and tasks</span></button>
      <button class="nav-i nav-top" type="button" data-to="legend"><span class="c">KEY</span><span class="n">How to read the page</span></button>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="top">
    <div class="top" role="toolbar" aria-label="Page controls">
      <button class="tbtn menu-btn" id="menu-btn" type="button" aria-controls="side" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span class="lbl">Contents</span>
      </button>
      <label class="search" for="ncs-q">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="ncs-q" type="search" placeholder="Search the cheatsheet" autocomplete="off" spellcheck="false">
        <span class="hits" id="hits" hidden></span>
        <kbd aria-hidden="true">/</kbd>
      </label>
      <button class="tbtn" id="wrap-btn" type="button" aria-pressed="false" title="Wrap long code lines">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3.5h11M1.5 7h8.5a2 2 0 0 1 0 4H7m0 0 1.6-1.6M7 11l1.6 1.6M1.5 10.5h3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Wrap</span>
      </button>
      <button class="tbtn" id="collapse-all" type="button" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl" id="collapse-lbl">Collapse all</span>
      </button>
      <button class="tbtn icon theme-btn" id="theme-btn" type="button" aria-label="Switch light / dark theme" title="Switch light / dark theme">
        <svg class="sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.4A5.6 5.6 0 0 1 5.6 2.8a5.6 5.6 0 1 0 7.6 7.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <header class="hero" id="hero"></header>

    <section class="map" id="map" aria-labelledby="map-h">
      <div class="sec-h"><span class="code">MAP</span><h2 id="map-h">Sections and tasks</h2><span class="ct" id="map-ct"></span></div>
      <p class="sec-blurb" id="map-blurb"></p>
      <div class="map-grid" id="map-grid"></div>
    </section>

    <section class="legend" id="legend" aria-labelledby="legend-h">
      <h2 id="legend-h">How to read the page</h2>
      <ul class="howto" id="howto"></ul>
    </section>

    <div id="secs"></div>
    <div class="empty" id="empty" hidden></div>

    <footer class="foot" id="foot"></footer>
  </main>
</div>
<script>
/*@@FILE kit/10-render.js@@*/
/* ===== Diagram renderer: data spec -> inline SVG (seq | flow | tl | chart) ===== */
window.DG = (function () {
  'use strict';
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var r = function (n) { return Math.round(n * 10) / 10; };
  var CWF = { sans: 0.555, bold: 0.6, mono: 0.62 };
  function tw(s, fs, f) { return String(s).length * fs * (CWF[f || 'sans']); }
  function wrap(text, maxW, fs, f) {
    var out = [];
    String(text == null ? '' : text).split('\n').forEach(function (par) {
      var words = par.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        var c = line ? line + ' ' + w : w;
        if (!line || tw(c, fs, f) <= maxW) line = c; else { out.push(line); line = w; }
      });
      out.push(line);
    });
    return out;
  }
  function kc(k) { return 'k-' + (k || 'n'); }
  function maxw(lines, fs, f) { var m = 0; lines.forEach(function (l) { m = Math.max(m, tw(l, fs, f)); }); return m; }
  /* multi-line text, vertically centred on cy */
  function T(lines, x, cy, fs, cls, anchor, lh) {
    lh = lh || 1.28; anchor = anchor || 'middle';
    var h = lines.length * fs * lh, s = '';
    lines.forEach(function (ln, i) {
      var y = cy - h / 2 + fs * lh * (i + 0.5) + fs * 0.35;
      s += '<text x="' + r(x) + '" y="' + r(y) + '" text-anchor="' + anchor + '" class="' + (cls || '') + '" style="font-size:' + fs + 'px">' + esc(ln) + '</text>';
    });
    return s;
  }
  function AH(x, y, ang, k, size) {
    size = size || 7.5; var a = Math.PI / 7.2;
    return '<path class="ah ' + kc(k) + '" d="M' + r(x) + ' ' + r(y) + 'L' + r(x - size * Math.cos(ang - a)) + ' ' + r(y - size * Math.sin(ang - a)) +
      'L' + r(x - size * Math.cos(ang + a)) + ' ' + r(y - size * Math.sin(ang + a)) + 'Z"/>';
  }
  function XM(x, y, k) {
    var d = 3.4;
    return '<circle class="xm-c ' + kc(k || 'b') + '" cx="' + r(x) + '" cy="' + r(y) + '" r="7.5"/>' +
      '<path class="xm-l ' + kc(k || 'b') + '" d="M' + r(x - d) + ' ' + r(y - d) + 'L' + r(x + d) + ' ' + r(y + d) + 'M' + r(x + d) + ' ' + r(y - d) + 'L' + r(x - d) + ' ' + r(y + d) + '"/>';
  }
  /* label with a background plate so lines/lifelines don't cut through it */
  function LBL(text, x, y, fs, k, maxW, f) {
    var lines = wrap(text, maxW || 140, fs, f), w = maxw(lines, fs, f) + 10, h = lines.length * fs * 1.25 + 6;
    var cls = 't-l' + (k && k !== 'n' ? ' tk ' + kc(k) : '') + (f === 'mono' ? ' t-m' : '');
    return '<rect class="lbg" x="' + r(x - w / 2) + '" y="' + r(y - h / 2) + '" width="' + r(w) + '" height="' + r(h) + '" rx="4"/>' + T(lines, x, y, fs, cls, 'middle', 1.25);
  }
  function SHAPE(sh, cx, cy, w, h, k) {
    var x = cx - w / 2, y = cy - h / 2, c = 'nd ' + kc(k), s = '', i;
    switch (sh) {
      case 'db': {
        var ry = Math.min(7, h / 5);
        return '<path class="' + c + '" d="M' + r(x) + ' ' + r(y + ry) + 'A' + r(w / 2) + ' ' + ry + ' 0 0 1 ' + r(x + w) + ' ' + r(y + ry) + 'V' + r(y + h - ry) +
          'A' + r(w / 2) + ' ' + ry + ' 0 0 1 ' + r(x) + ' ' + r(y + h - ry) + 'Z"/><path class="nd-l ' + kc(k) + '" d="M' + r(x) + ' ' + r(y + ry) + 'A' + r(w / 2) + ' ' + ry + ' 0 0 0 ' + r(x + w) + ' ' + r(y + ry) + '"/>';
      }
      case 'queue':
        s = '<rect class="' + c + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="6"/>';
        for (i = 0; i < 3; i++) { var lx = x + w - 9 - i * 6; s += '<line class="nd-l ' + kc(k) + '" x1="' + r(lx) + '" y1="' + r(y + 7) + '" x2="' + r(lx) + '" y2="' + r(y + h - 7) + '"/>'; }
        return s;
      case 'pill': case 'actor': case 'chip':
        return '<rect class="' + c + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="' + r(h / 2) + '"/>';
      case 'ext':
        return '<rect class="' + c + ' dash" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="8"/>';
      case 'browser':
        s = '<rect class="' + c + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="7"/>' +
          '<line class="nd-l ' + kc(k) + '" x1="' + r(x) + '" y1="' + r(y + 12) + '" x2="' + r(x + w) + '" y2="' + r(y + 12) + '"/>';
        for (i = 0; i < 3; i++) s += '<circle class="nd ' + kc(k) + '" cx="' + r(x + 8 + i * 6) + '" cy="' + r(y + 6) + '" r="1.7"/>';
        return s;
      case 'doc':
        return '<path class="' + c + '" d="M' + r(x) + ' ' + r(y) + 'H' + r(x + w - 11) + 'L' + r(x + w) + ' ' + r(y + 11) + 'V' + r(y + h) + 'H' + r(x) + 'Z"/>' +
          '<path class="nd-l ' + kc(k) + '" d="M' + r(x + w - 11) + ' ' + r(y) + 'V' + r(y + 11) + 'H' + r(x + w) + '"/>';
      case 'stack':
        return '<rect class="' + c + '" x="' + r(x + 8) + '" y="' + r(y - 8) + '" width="' + r(w) + '" height="' + r(h) + '" rx="8"/>' +
          '<rect class="' + c + '" x="' + r(x + 4) + '" y="' + r(y - 4) + '" width="' + r(w) + '" height="' + r(h) + '" rx="8"/>' +
          '<rect class="' + c + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="8"/>';
      case 'note': return '';
      default:
        return '<rect class="' + c + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '" rx="8"/>';
    }
  }

public IList<IList<int>> ThreeSum(int[] nums)
{
    Array.Sort(nums);
    var res = new List<IList<int>>();
    for (int i = 0; i < nums.Length - 2; i++)
    {
        if (i > 0 && nums[i] == nums[i - 1]) continue;          // skip duplicate anchors

            }
        }
    }

public int Trap(int[] h)
{
    int l = 0, r = h.Length - 1, leftMax = 0, rightMax = 0, water = 0;

    {

        {

        }

public int[] MaxSlidingWindow(int[] nums, int k)
{
    var dq = new LinkedList<int>();                    // indexes; their values decrease front → back
    var res = new int[nums.Length - k + 1];
    for (int i = 0; i < nums.Length; i++)
    {
        if (dq.Count > 0 && dq.First.Value <= i - k) dq.RemoveFirst();        // slid out of the window
        while (dq.Count > 0 && nums[dq.Last.Value] <= nums[i]) dq.RemoveLast(); // can never be the max now
        dq.AddLast(i);
        if (i >= k - 1) res[i - k + 1] = nums[dq.First.Value];
    }
    return res;
}`,

public class Trie
{
    private sealed class Node
    {
        public readonly Node[] Next = new Node[26];
        public bool End;                              // a word ends here
    }
    private readonly Node _root = new();

    public void Insert(string word)
    {
        var n = _root;
        foreach (char c in word) n = n.Next[c - 'a'] ??= new Node();
        n.End = true;
    }
    public bool Search(string word) => Find(word)?.End == true;
    public bool StartsWith(string prefix) => Find(prefix) != null;

    private Node Find(string s)

        var n = _root;
        foreach (char c in s)

        return n;
    }

public IList<string> FindWords(char[][] board, string[] words)
{
    var root = new TrieNode();
    foreach (string w in words)                       // 1. a trie of all the words
    {
        var n = root;
        foreach (char c in w) n = n.Next[c - 'a'] ??= new TrieNode();
        n.Word = w;                                   // the word that ends here
    }
    var found = new List<string>();
    int rows = board.Length, cols = board[0].Length;
    void Dfs(int r, int c, TrieNode parent)
    {
        char ch = board[r][c];
        TrieNode node = ch == '#' ? null : parent.Next[ch - 'a'];
        if (node == null) return;                     // no word continues this way: prune
        if (node.Word != null) { found.Add(node.Word); node.Word = null; }   // report each word once
        board[r][c] = '#';                            // mark as used on this path
        if (r > 0) Dfs(r - 1, c, node);
        if (r < rows - 1) Dfs(r + 1, c, node);
        if (c > 0) Dfs(r, c - 1, node);
        if (c < cols - 1) Dfs(r, c + 1, node);
        board[r][c] = ch;                             // undo
    }
    for (int r = 0; r < rows; r++)
        for (int c = 0; c < cols; c++)
            Dfs(r, c, root);
    return found;
}

    long hp = 0, ht = 0, power = 1;                       // power = B^(m − 1) mod Mod

{
    int lo = 1, hi = piles.Max();                     // the answer lies in [lo, hi]
    while (lo < hi)
    {
        int mid = lo + (hi - lo) / 2;
        if (CanFinish(piles, h, mid)) hi = mid;       // fast enough: try slower

public int SearchRotated(int[] nums, int target)
{
    int lo = 0, hi = nums.Length - 1;
    while (lo <= hi)
    {
        int mid = lo + (hi - lo) / 2;
        if (nums[mid] == target) return mid;
        if (nums[lo] <= nums[mid])                                   // the left half is sorted
        {
            if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;
            else lo = mid + 1;
        }
        else                                                         // the right half is sorted

            if (nums[mid] < target && target <= nums[hi]) lo = mid + 1;
            else hi = mid - 1;
        }
    }

public double FindMedianSortedArrays(int[] a, int[] b)
{
    if (a.Length > b.Length) (a, b) = (b, a);          // binary search the shorter array

    int lo = 0, hi = m;
    while (lo <= hi)
    {
        int i = (lo + hi) / 2, j = half - i;             // the left half takes i from a and j from b
        int aLeft = i == 0 ? int.MinValue : a[i - 1], aRight = i == m ? int.MaxValue : a[i];
        int bLeft = j == 0 ? int.MinValue : b[j - 1], bRight = j == n ? int.MaxValue : b[j];
        if (aLeft <= bRight && bLeft <= aRight)          // every left value ≤ every right value
            return (m + n) % 2 == 1

public class LRUCache
{
    private readonly int _capacity;
    private readonly Dictionary<int, LinkedListNode<(int key, int val)>> _map = new();

    public LRUCache(int capacity) => _capacity = capacity;

    public int Get(int key)
    {
        if (!_map.TryGetValue(key, out var node)) return -1;
        _order.Remove(node);                     // O(1): we hold the node itself
        _order.AddFirst(node);
        return node.Value.val;
    }

    {
        if (_map.TryGetValue(key, out var node)) _order.Remove(node);
        else if (_map.Count == _capacity)
        {
            _map.Remove(_order.Last.Value.key);  // evict the least recently used
            _order.RemoveLast();
        }
        _map[key] = _order.AddFirst((key, value));
    }
}`,

public class RandomizedSet
{
    private readonly List<int> _items = new();
    private readonly Dictionary<int, int> _index = new();      // value → position in _items

    {
        if (!_index.TryAdd(val, _items.Count)) return false;
        _items.Add(val);
        return true;

        if (!_index.Remove(val, out int i)) return false;

    private readonly Dictionary<string, List<(int time, string val)>> _data = new();

    public void Set(string key, string value, int timestamp)        // timestamps arrive in increasing order

public string Serialize(TreeNode root)
{
    var sb = new StringBuilder();
    void Write(TreeNode n)
    {
        if (n == null) { sb.Append("#,"); return; }
        sb.Append(n.val).Append(',');
        Write(n.left);
        Write(n.right);
    }
    Write(root);
    return sb.ToString();
}

public TreeNode Deserialize(string data)
{
    var tokens = new Queue<string>(data.Split(',', StringSplitOptions.RemoveEmptyEntries));
    TreeNode Read()
    {
        string t = tokens.Dequeue();
        if (t == "#") return null;
        var n = new TreeNode(int.Parse(t));
        n.left = Read();                 // same order as Write: node, left, right
        n.right = Read();
        return n;
    }
    return Read();
}`,

public class Node
{
    public int val;
    public IList<Node> neighbors = new List<Node>();

public Node CloneGraph(Node node)
{
    if (node == null) return null;
    var copies = new Dictionary<Node, Node>();
    Node Clone(Node n)
    {
        if (copies.TryGetValue(n, out var c)) return c;
        c = copies[n] = new Node(n.val);                 // register before recursing: handles cycles

    }

public int LadderLength(string beginWord, string endWord, IList<string> wordList)
{
    var words = new HashSet<string>(wordList);
    if (!words.Contains(endWord)) return 0;
    var q = new Queue<string>();
    q.Enqueue(beginWord);
    words.Remove(beginWord);
    for (int length = 1; q.Count > 0; length++)          // words in the sequence so far
    {
        for (int size = q.Count; size > 0; size--)       // one BFS level
        {
            var w = q.Dequeue().ToCharArray();
            if (new string(w) == endWord) return length;
            for (int i = 0; i < w.Length; i++)
            {
                char orig = w[i];
                for (char c = 'a'; c <= 'z'; c++)
                {
                    w[i] = c;
                    string next = new string(w);
                    if (words.Remove(next)) q.Enqueue(next);   // Remove = visit: each word once
                }
                w[i] = orig;
            }
        }
    }
    return 0;
}`,

public int[] FindOrder(int numCourses, int[][] prerequisites)
{
    var adj = new List<int>[numCourses];
    var indeg = new int[numCourses];

public int NetworkDelayTime(int[][] times, int n, int k)      // nodes 1..n; edge = [u, v, w]
{
    var adj = new List<(int to, int w)>[n + 1];
    for (int i = 1; i <= n; i++) adj[i] = new List<(int, int)>();
    foreach (var t in times) adj[t[0]].Add((t[1], t[2]));

    var dist = new int[n + 1];
    Array.Fill(dist, int.MaxValue);
    dist[k] = 0;
    var pq = new PriorityQueue<int, int>();
    pq.Enqueue(k, 0);
    while (pq.TryDequeue(out int u, out int d))
    {
        if (d > dist[u]) continue;                             // stale: a shorter path already won
        foreach (var (v, w) in adj[u])
            if (d + w < dist[v])
            {
                dist[v] = d + w;
                pq.Enqueue(v, dist[v]);                        // no decrease-key: push a new entry
            }
    }
    int max = dist.Skip(1).Max();
    return max == int.MaxValue ? -1 : max;
}`,

public int[,] AllPairs(int n, int[][] edges)          // edge = [u, v, w], directed
{
    const int Inf = int.MaxValue / 2;                 // half, so Inf + Inf can't overflow
    var d = new int[n, n];
    for (int i = 0; i < n; i++)
        for (int j = 0; j < n; j++) d[i, j] = i == j ? 0 : Inf;
    foreach (var e in edges) d[e[0], e[1]] = Math.Min(d[e[0], e[1]], e[2]);
    for (int k = 0; k < n; k++)                       // k outermost: paths through nodes 0..k
        for (int i = 0; i < n; i++)
            for (int j = 0; j < n; j++)
                d[i, j] = Math.Min(d[i, j], d[i, k] + d[k, j]);
    return d;
}`,

public class DSU
{
    private readonly int[] _parent, _size;
    public int Components { get; private set; }

    public DSU(int n)
    {
        _parent = new int[n];
        _size = new int[n];
        for (int i = 0; i < n; i++) { _parent[i] = i; _size[i] = 1; }
        Components = n;
    }

    public int Find(int x)
    {
        while (_parent[x] != x)
        {
            _parent[x] = _parent[_parent[x]];        // path halving: point at the grandparent
            x = _parent[x];
        }
        return x;
    }

    public bool Union(int a, int b)                  // false if already in the same group
    {
        int ra = Find(a), rb = Find(b);
        if (ra == rb) return false;
        if (_size[ra] < _size[rb]) (ra, rb) = (rb, ra);
        _parent[rb] = ra;                            // hang the smaller tree under the larger
        _size[ra] += _size[rb];
        Components--;
        return true;
    }
}`,

{
    var cols = new bool[n];

    bindSeg(el, function (k, v) { mode = v; render(); });
    render();
  }

  /* a sheet adds its own widgets in NCS_WIDGETS: id -> function (el, block, kit) */
  var KIT = { $: $, $$: $$, esc: esc, inl: inl, plain: plain, seg: segHTML, bindSeg: bindSeg, code: codeBox, copy: cpBtn, hl: hlLine, lang: DEF };
  var WIDGETS = Object.assign({ picker: pickerWidget, steps: stepsWidget }, window.NCS_WIDGETS || {});
  $$('.wdg[data-w]').forEach(function (el) {
    try { WIDGETS[el.getAttribute('data-w')](el, IDX[el.closest('[data-id]').getAttribute('data-id')], KIT); }
    catch (err) { console.error('Widget failed', err); el.innerHTML = '<div class="dg-err">This widget failed to load: ' + esc(err.message) + '</div>'; }
  });

  /* ======================= interactions ======================= */
  var side = $('#side'), scrim = $('#scrim'), mb = $('#menu-btn');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function openNav() { document.body.classList.add('nav-open'); scrim.hidden = false; mb.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); scrim.hidden = true; mb.setAttribute('aria-expanded', 'false'); }
  function setShut(sec, on) {
    sec.classList.toggle('shut', on);
    var t = $('.sec-tg', sec); t.setAttribute('aria-expanded', String(!on));
    t.setAttribute('aria-label', (on ? 'Expand ' : 'Collapse ') + $('h2', sec).textContent);
  }
  function go(id) {
    var el = document.getElementById(id); if (!el) return;
    if (el.hidden && q.value) { q.value = ''; filter(); }
    var sec = el.closest('.sec'); if (sec && sec.classList.contains('shut')) setShut(sec, false);
    closeNav();
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (el.classList.contains('blk') || el.classList.contains('call') || el.classList.contains('sub')) { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1400); }
  }
  function copyText(btn, txt) {
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1300); };
    var fallback = function () {
      try { var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }
      catch (e) { btn.textContent = 'Select & copy'; }
    };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  }
  document.addEventListener('click', function (ev) {
    var cp = ev.target.closest('[data-copy]');
    if (cp) { copyText(cp, COPY[cp.getAttribute('data-copy')] || ''); return; }
    var t = ev.target.closest('[data-to]');
    if (t) { ev.preventDefault(); go(t.getAttribute('data-to')); return; }
    var sb = ev.target.closest('.blk[data-state] .blk-h .seg button');
    if (sb) {
      var card = sb.closest('.blk'), s = sb.getAttribute('data-s');
      card.setAttribute('data-state', s);
      $$('.seg button', card).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-s') === s)); });
      return;
    }
    var tg = ev.target.closest('.sec-tg');
    if (tg) { var sec = tg.closest('.sec'); setShut(sec, !sec.classList.contains('shut')); return; }
    var ngh = ev.target.closest('.nav-gh');
    if (ngh) { var ng = ngh.parentNode, shut = !ng.classList.contains('shut'); ng.classList.toggle('shut', shut); ngh.setAttribute('aria-expanded', String(!shut)); }
  });
  var allShut = false;
  $('#collapse-all').addEventListener('click', function () {
    allShut = !allShut;
    $$('.sec').forEach(function (s) { setShut(s, allShut); });
    this.setAttribute('aria-pressed', String(allShut));
    $('#collapse-lbl').textContent = allShut ? 'Expand all' : 'Collapse all';
  });

  /* theme */
  $('#theme-btn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    if (!cur) cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ncs-theme', next); } catch (e) { }
  });

  /* wrap long lines */
  var wrapBtn = $('#wrap-btn'), wrap = null;
  try { wrap = localStorage.getItem('ncs-wrap'); } catch (e) { }
  wrap = wrap === null ? !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches) : wrap === '1';
  function setWrap(on) { wrap = on; document.body.classList.toggle('wrap', on); wrapBtn.setAttribute('aria-pressed', String(on)); }
  setWrap(wrap);
  wrapBtn.addEventListener('click', function () { setWrap(!wrap); try { localStorage.setItem('ncs-wrap', wrap ? '1' : '0'); } catch (e) { } });

  /* mobile nav */
  mb.addEventListener('click', function () { document.body.classList.contains('nav-open') ? closeNav() : openNav(); });
  scrim.addEventListener('click', closeNav);

  /* ---- search ---- */
  var q = $('#ncs-q'), hits = $('#hits'), timer;
  q.placeholder = SEARCH.placeholder && !(window.matchMedia && window.matchMedia('(max-width: 760px)').matches) ? SEARCH.placeholder : 'Search the cheatsheet';
  var blocks = $$('.blks > [data-id]'), TEXT = {};
  function btext(b) {
    var parts = [b.sec.code, b.sec.name, b.t, b.v, b.code, b.bad, b.good, b.note, b.badNote, b.goodNote, b.cap, b.capB, b.capF, b.text, b.kw, b.call && b.call.text];
    if (b.rows) parts.push(b.cols.join(' '), b.rows.map(function (r) { return r.join(' '); }).join(' '));
    if (b.k === 'widget') {                                   /* what a widget shows is searchable too */
      if (b.items) parts.push(b.items.map(function (c) { return [c.need, c.use, c.hint, c.code, c.why].join(' '); }).join(' '));
      if (Array.isArray(b.good)) parts.push(b.good.concat(b.bad || []).map(function (x) { return x.join(' '); }).join(' '));
      var w = WIDGETS[b.w];                                   /* a custom widget can add its own search text */
      if (w && w.text) parts.push(typeof w.text === 'function' ? w.text(b) : w.text);
    }
    return parts.filter(Boolean).join(' ').toLowerCase();
  }
  blocks.forEach(function (el) { var id = el.getAttribute('data-id'); TEXT[id] = btext(IDX[id]); });
  function filter() {
    var terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean), n = 0, active = terms.length > 0;
    blocks.forEach(function (el) {
      var ok = !active || terms.every(function (t) { return TEXT[el.getAttribute('data-id')].indexOf(t) > -1; });
      el.hidden = !ok; if (ok && active && !el.classList.contains('call')) n++;
    });
    $$('.sec').forEach(function (s) {
      var vis = $$('.blks > [data-id]', s).some(function (b) { return !b.hidden; });
      s.hidden = !vis;
      var ni = $('.nav-i[data-to="' + s.id + '"]'); if (ni) ni.parentNode.hidden = !vis;
    });
    if (PROG) $('.nav-i[data-to="prog"]').parentNode.hidden = active;     /* the annotated file is not a search result */
    $$('.nav-g').forEach(function (g) { g.hidden = !$$('.nav-list li', g).some(function (li) { return !li.hidden; }); });
    /* a sub-heading stays only while one of the cards under it matches */
    $$('.blks').forEach(function (list) {
      var sub = null, any = false;
      Array.prototype.forEach.call(list.children, function (el) {
        if (el.classList.contains('sub')) { if (sub) sub.hidden = active && !any; sub = el; any = false; }
        else if (!el.hidden) any = true;
      });
      if (sub) sub.hidden = active && !any;
    });
    document.body.classList.toggle('searching', active);
    $('.hero').hidden = active; $('#map').hidden = active; $('#legend').hidden = active; if (PROG) $('#prog').hidden = active; $('#nav-top').hidden = active;
    $$('.gband').forEach(function (b) { b.hidden = active; });
    hits.hidden = !active; hits.textContent = n + ' / ' + CARDS;
    $('#empty').hidden = !(active && n === 0 && !$$('.blks > .call').some(function (c) { return !c.hidden; }));
  }
  q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(filter, 90); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; filter(); q.blur(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') closeNav();
  });

  /* ---- scroll spy ---- */
  var navItems = {}; $$('.nav-i[data-to]').forEach(function (b) { navItems[b.getAttribute('data-to')] = b; });
  $$('.nav-g').forEach(function (g) { navItems['g-' + g.getAttribute('data-g')] = $('.nav-gh', g); });   /* a group band lights its heading */
  var current = null;
  function mark(id) {
    if (current === id) return; current = id;
    $$('.nav-i.on, .nav-gh.on').forEach(function (b) { b.classList.remove('on'); });
    $$('.nav-g.cur').forEach(function (g) { g.classList.remove('cur'); });
    var b = navItems[id]; if (!b) return;
    b.classList.add('on');
    var grp = b.closest('.nav-g'); if (grp) grp.classList.add('cur');                                    /* the group you are in */
    var sr = side.getBoundingClientRect(), br = b.getBoundingClientRect();
    if (br.top < sr.top + 40 || br.bottom > sr.bottom - 40) side.scrollTop += br.top - sr.top - sr.height / 3;
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) mark(en.target.id); });
    }, { rootMargin: '-15% 0px -75% 0px' });
    $$('.sec, .gband').forEach(function (s) { io.observe(s); });
    io.observe($('#map')); io.observe($('#legend')); if (PROG) io.observe($('#prog'));
  }
})();
</script>
</body>
</html>
